let exchangeEditor = null; // null | {mode:'new'|'edit', id, name, kind, cost, per, tiers:[]}

function renderExchangeTree() {
  const items = store._exchangeItems || [];
  const d = getDayData(currentDate);
  if (!d.exchangeTree) d.exchangeTree = [];

  // 编辑态：渲染编辑器
  if (exchangeEditor) {
    $('exchangeTreeBody').innerHTML = renderExchangeEditorHtml();
    return;
  }

  let html = `<div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:6px;">兑换物品消耗金币（计入金币堆，不计入今日获得金币）</div>`;

  items.forEach(it => {
    const needsAmt = it.kind !== 'flat';
    html += `<div class="ex-item">
      <div class="ex-item-head">
        <span class="ex-name">${it.name}</span>
        <span class="ex-desc">${describeItem(it)}</span>
      </div>
      <div class="ex-item-actions">
        ${needsAmt ? `<input type="number" id="exAmt_${it.id}" min="0" placeholder="金额(元)" style="width:78px;font-size:0.8rem;">` : ''}
        <button class="ex-btn" onclick="doExchange('${it.id}')">兑换</button>
        <button class="ex-btn ghost" onclick="openExchangeEditor('${it.id}')">编辑</button>
        <button class="ex-btn ghost" onclick="deleteExchangeItem('${it.id}')">删除</button>
      </div>
    </div>`;
  });

  // 今日兑换记录
  if (d.exchangeTree.length) {
    html += `<div style="margin-top:10px;font-weight:600;font-size:0.8rem;color:var(--text-dim);">${currentDate === todayStr() ? '今日' : '该日'}兑换记录</div>`;
    d.exchangeTree.forEach(r => {
      const amtTxt = (r.amount != null && r.amount !== '') ? `（${r.amount}元）` : '';
      html += `<div class="ex-record">
        <span>${r.name}${amtTxt}</span>
        <span style="color:var(--red);">-${fmtCoin(r.cost)}</span>
        <button class="ex-btn ghost" onclick="deleteExchangeRecord('${r.rid}')">×</button>
      </div>`;
    });
  }

  html += `<button class="ex-btn add" style="margin-top:10px;" onclick="openExchangeEditor(null)">+ 添加物品</button>`;

  $('exchangeTreeBody').innerHTML = html;
}

function renderExchangeEditorHtml() {
  const e = exchangeEditor;
  let tierHtml = '';
  if (e.kind === 'tiered') {
    e.tiers.forEach((t, idx) => {
      const upVal = (t.upTo === Infinity || t.upTo >= 1e9) ? '' : t.upTo;
      tierHtml += `<div class="ex-tier-row">
        ≤<input type="number" value="${upVal}" placeholder="上限元" onchange="exchangeEditor.tiers[${idx}].upTo=(this.value===''?Infinity:Number(this.value))" style="width:64px;">元
        消耗<input type="number" value="${t.cost}" onchange="exchangeEditor.tiers[${idx}].cost=Number(this.value)" style="width:54px;">分
        <button class="ex-btn ghost" onclick="exEditorRemoveTier(${idx})">删</button>
      </div>`;
    });
  }
  return `<div class="ex-editor">
    <div style="font-weight:600;margin-bottom:8px;">${e.mode === 'edit' ? '编辑物品' : '添加物品'}</div>
    <div class="form-row"><label>名称</label><input type="text" id="exEdName" value="${e.name}" oninput="exchangeEditor.name=this.value" style="flex:1;min-width:0;"></div>
    <div class="form-row"><label>计价方式</label>
      <select id="exEdKind" onchange="exchangeEditor.kind=this.value; renderExchangeTree();">
        <option value="flat" ${e.kind === 'flat' ? 'selected' : ''}>固定分</option>
        <option value="per100" ${e.kind === 'per100' ? 'selected' : ''}>每100元消耗</option>
        <option value="tiered" ${e.kind === 'tiered' ? 'selected' : ''}>按金额分档</option>
      </select>
    </div>
    ${e.kind === 'flat' ? `<div class="form-row"><label>消耗(分)</label><input type="number" id="exEdCost" value="${e.cost}" oninput="exchangeEditor.cost=Number(this.value)" style="width:84px;"></div>` : ''}
    ${e.kind === 'per100' ? `<div class="form-row"><label>每100元消耗(分)</label><input type="number" id="exEdPer" value="${e.per}" oninput="exchangeEditor.per=Number(this.value)" style="width:84px;"></div>` : ''}
    ${e.kind === 'tiered' ? `<div class="ex-tiers"><div style="font-size:0.76rem;color:var(--text-muted);margin-bottom:4px;">档位（上限留空=无上限）：</div>${tierHtml}<button class="ex-btn ghost" onclick="exEditorAddTier()">+ 添加档位</button></div>` : ''}
    <div class="form-row" style="margin-top:10px;gap:8px;">
      <button class="ex-btn" onclick="saveExchangeEditor()">保存</button>
      <button class="ex-btn ghost" onclick="closeExchangeEditor()">取消</button>
    </div>
  </div>`;
}

function doExchange(itemId) {
  const items = store._exchangeItems || [];
  const item = items.find(x => x.id === itemId);
  if (!item) return;
  let amount = null, cost = 0;
  if (item.kind !== 'flat') {
    const inp = document.getElementById('exAmt_' + itemId);
    amount = inp ? Number(inp.value) : 0;
    if (!amount || amount <= 0) { showToast('请输入金额'); return; }
  }
  cost = computeExchangeCost(item, amount);
  const d = getDayData(currentDate);
  if (!d.exchangeTree) d.exchangeTree = [];
  d.exchangeTree.push({
    rid: 'r' + Date.now() + Math.random().toString(36).slice(2, 6),
    itemId: itemId, name: item.name, amount: amount, cost: cost, ts: Date.now()
  });
  saveStore();
  renderExchangeTree();
  renderStatsBar();
  showToast(`已兑换 ${item.name}：-${fmtCoin(cost)} 金币`);
}

function deleteExchangeRecord(rid) {
  const d = getDayData(currentDate);
  if (!d.exchangeTree) return;
  d.exchangeTree = d.exchangeTree.filter(r => r.rid !== rid);
  saveStore();
  renderExchangeTree();
  renderStatsBar();
}

function openExchangeEditor(itemId) {
  const items = store._exchangeItems || [];
  if (itemId) {
    const it = items.find(x => x.id === itemId);
    if (!it) return;
    exchangeEditor = {
      mode: 'edit', id: itemId,
      name: it.name, kind: it.kind,
      cost: it.cost || 0, per: it.per || 0,
      tiers: (it.tiers || []).map(t => ({ upTo: t.upTo, cost: t.cost }))
    };
  } else {
    exchangeEditor = {
      mode: 'new', id: null,
      name: '', kind: 'flat',
      cost: 5, per: 10,
      tiers: [ { upTo: 100, cost: 10 }, { upTo: Infinity, cost: 20 } ]
    };
  }
  renderExchangeTree();
}

function closeExchangeEditor() { exchangeEditor = null; renderExchangeTree(); }

function exEditorAddTier() { exchangeEditor.tiers.push({ upTo: 100, cost: 10 }); renderExchangeTree(); }
function exEditorRemoveTier(idx) { exchangeEditor.tiers.splice(idx, 1); renderExchangeTree(); }

function saveExchangeEditor() {
  const name = document.getElementById('exEdName').value.trim();
  if (!name) { showToast('请输入名称'); return; }
  const kind = document.getElementById('exEdKind').value;
  const item = { id: exchangeEditor.id || ('ex' + Date.now()), name: name, kind: kind, cost: 0, per: 0, tiers: [] };
  if (kind === 'flat') {
    item.cost = Number(document.getElementById('exEdCost').value) || 0;
  } else if (kind === 'per100') {
    item.per = Number(document.getElementById('exEdPer').value) || 0;
  } else if (kind === 'tiered') {
    item.tiers = exchangeEditor.tiers.map(t => ({ upTo: (t.upTo >= 1e9 ? Infinity : Number(t.upTo)), cost: Number(t.cost) || 0 }));
    if (!item.tiers.length) { showToast('请至少添加一个档位'); return; }
  }
  let items = store._exchangeItems || [];
  if (exchangeEditor.mode === 'edit') {
    const idx = items.findIndex(x => x.id === exchangeEditor.id);
    if (idx >= 0) items[idx] = item; else items.push(item);
  } else {
    items.push(item);
  }
  store._exchangeItems = items;
  saveStore();
  exchangeEditor = null;
  renderExchangeTree();
  showToast('已保存');
}

function deleteExchangeItem(itemId) {
  let items = store._exchangeItems || [];
  items = items.filter(x => x.id !== itemId);
  store._exchangeItems = items;
  saveStore();
  renderExchangeTree();
  renderStatsBar();
  showToast('已删除物品');
}

// ===== 韧性积分渲染 =====
function renderTenacity() {
  const d = getDayData(currentDate);
  const tt = calcTenacityToday(currentDate);
  const todayDow = getDayOfWeek(parseDate(currentDate));

  // 先存储今日韧性积分，再计算总数（确保 calcTotalTenacity 读到最新值）
  d._tenacityToday = tt.total;
  const totalTen = calcTotalTenacity();

  // 计算连续周期天数（每满3天清零，当前周期内显示 1/2/3）
  const durDays = getStreakCycleCount(currentDate, (d) => Number(d.sleepDuration) >= 450);
  const prepDays = getStreakCycleCount(currentDate, isPrepareSleepOnTime);
  const fallDays = getStreakCycleCount(currentDate, (d) => {
    if (!d.sleepFallAsleepTime) return false;
    const [h, m] = d.sleepFallAsleepTime.split(':').map(Number);
    const totalMin = h * 60 + m;
    return totalMin >= 20 * 60 && totalMin <= 23 * 60 + 59;
  });

  // 准备睡觉连击的文案随规则变更日切换（查看日决定显示哪条规则）
  const prepLabel = (currentDate >= PREP_RULE_CHANGE_DATE)
    ? '连续3天准备睡觉时间≤22:30（+2）'
    : '连续3天准备睡觉时间≤23:00（+1）';

  let html = `
    <div class="tenacity-header">
      <div class="t-stat">
        <div class="t-label">睡眠银行韧性积分</div>
        <div class="t-value">${totalTen}</div>
      </div>
      <div class="t-stat clickable" onclick="showTenacityBreakdown()" style="cursor:pointer;">
        <div class="t-label">${currentDate === todayStr() ? '今日获得' : '该日获得'}韧性积分</div>
        <div class="t-value">${tt.total >= 0 ? '+' : ''}${tt.total}</div>
      </div>
      <div class="t-stat">
        <div class="t-label">是否使用韧性积分</div>
        <div class="t-value">
          <input type="checkbox" id="voucherExchanged" onchange="onVoucherChange()" ${d.voucherExchanged ? 'checked' : ''} style="accent-color:var(--accent);">
        </div>
      </div>
      <div class="t-stat">
        <div class="t-label">贷款利息</div>
        <div class="t-value" style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <label style="font-size:0.66rem;font-weight:400;color:var(--text-dim);display:flex;align-items:center;gap:3px;cursor:pointer;">
            <input type="checkbox" id="loanActive" onchange="onLoanActiveChange()" ${d.loanActive ? 'checked' : ''} style="accent-color:var(--accent);width:14px;height:14px;">贷款中
          </label>
          <input type="number" id="loanInterest" min="0" step="1" value="${(d.loanInterest === '' || d.loanInterest == null) ? '' : d.loanInterest}" onchange="onLoanInterestChange(this.value)" placeholder="利息" style="width:100%;box-sizing:border-box;font-size:0.72rem;font-weight:400;padding:2px 4px;border:1px solid var(--border);border-radius:4px;background:var(--bg-input);color:var(--text);text-align:center;outline:none;">
        </div>
      </div>
    </div>`;

  // 抵押券：勾了就扣本日 -10；时光穿越是否取消它由你手动回到那天改勾选框
  if (d.voucherExchanged) {
    html += `<div style="font-size:0.72rem;color:var(--orange);margin:4px 0 8px;padding-left:4px;">${voucherDeductionNote(currentDate)}</div>`;
  }

  // 贷款利息提示
  if (d.loanActive) {
    const li = Number(d.loanInterest) || 0;
    html += `<div style="font-size:0.72rem;color:${li > 0 ? 'var(--red)' : 'var(--text-muted)'};margin:4px 0 8px;padding-left:4px;">贷款中：当日扣除贷款利息 ${li > 0 ? '-' + li : '0'} 韧性积分</div>`;
  }

  // 检查是否因昨日为不眠者暂停
  const paused = isPrevDayInsomniac(currentDate);
  const pauseNote = paused ? '<span style="font-size:0.7rem;color:var(--orange);margin-left:6px;">因昨日为不眠者暂停一天</span>' : '';

  html += `
    <div class="tenacity-checks">
      <div class="tenacity-check-row">
        <span class="streak-badge ${durDays >= 3 ? 'streak-done' : ''}">${durDays}</span>
        <span>连续3天睡眠时长≥7.5h（+1）</span>
        ${paused ? pauseNote : ''}
      </div>
      <div class="tenacity-check-row">
        <span class="streak-badge ${prepDays >= 3 ? 'streak-done' : ''}">${prepDays}</span>
        <span>${prepLabel}</span>
        ${paused ? pauseNote : ''}
      </div>
      <div class="tenacity-check-row">
        <span class="streak-badge ${fallDays >= 3 ? 'streak-done' : ''}">${fallDays}</span>
        <span>连续3天入睡时间≤00:00（+3）</span>
        ${paused ? pauseNote : ''}
      </div>
    </div>

    ${renderTimeTravelHtml()}
  `;

  // 周结算（仅周日）
  if (todayDow === 0) {
    const weekly = calcWeeklyTenacity(currentDate);
    const monday = parseDate(getMonday(parseDate(currentDate)));
    const weekEnd = new Date(monday);
    weekEnd.setDate(weekEnd.getDate() + 6);

    html += `<div class="weekly-section">
      <div class="ws-title">📅 周结算 (${fmtDate(monday)} ~ ${fmtDate(weekEnd)})</div>
      <div class="tenacity-check-row">
        <span class="check-icon">${weekly.w1 ? '✅' : '⬜'}</span>
        <span>周平均睡眠时长比上周多 ≥ 10min，或两周均 > 8h → +3 韧性积分${weekly.w1Reason ? ` <span style="color:var(--green);font-size:0.72rem;">（${weekly.w1Reason}）</span>` : ''}</span>
      </div>
      <div class="tenacity-check-row">
        <span class="check-icon">${weekly.w2 ? '✅' : '⬜'}</span>
        <span>周平均入睡时间比上周早 ≥ 30min，或两周均 ≤ 23:30 → +3 韧性积分${weekly.w2Reason ? ` <span style="color:var(--green);font-size:0.72rem;">（${weekly.w2Reason}）</span>` : ''}</span>
      </div>
      <table class="weekly-table">
        <thead><tr><th></th><th colspan="2">上周</th><th colspan="2">本周</th></tr>
        <tr><th>日期</th><th>入睡时间</th><th>睡眠时长</th><th>入睡时间</th><th>睡眠时长</th></tr></thead>
        <tbody>`;

    // 单元格渲染：用抵押券抵扣的那天显示“-”，不计入周统计
    const wcell = (x, isDur) => {
      if (x.voucher) return '-';
      if (isDur) return x.duration ? Math.floor(x.duration/60)+'h'+x.duration%60+'min' : '—';
      return x.fallAsleep || '—';
    };

    for (let i = 0; i < 7; i++) {
      const lw = weekly.lastWeek[i];
      const tw = weekly.thisWeek[i];
      html += `<tr>
        <td>${lw.label}</td>
        <td>${wcell(lw, false)}</td>
        <td>${wcell(lw, true)}</td>
        <td>${wcell(tw, false)}</td>
        <td>${wcell(tw, true)}</td>
      </tr>`;
    }

    html += `<tr style="font-weight:600;border-top:1px solid var(--border);">
        <td>平均</td>
        <td>${weekly.lastHasData ? formatTimeMin(weekly.lastAvgSleep) : '—'}</td>
        <td>${weekly.lastAvgDur ? Math.floor(weekly.lastAvgDur/60)+'h'+Math.round(weekly.lastAvgDur%60)+'min' : '—'}</td>
        <td>${weekly.thisHasData ? formatTimeMin(weekly.thisAvgSleep) : '—'}</td>
        <td>${weekly.thisAvgDur ? Math.floor(weekly.thisAvgDur/60)+'h'+Math.round(weekly.thisAvgDur%60)+'min' : '—'}</td>
      </tr>`;

    html += `</tbody></table></div>`;
    // 周结算加分已纳入 calcTenacityToday，无需额外累加
  }

  $('tenacitySection').innerHTML = html;
  saveStore();
}

function formatTimeMin(totalMin) {
  const sign = totalMin < 0 ? '-' : '';
  const abs = Math.abs(totalMin);
  const h = Math.floor(abs / 60);
  const m = Math.round(abs % 60);
  return `${sign}${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

function showImportDialog() {

    <p style="font-size:0.8rem;color:var(--text-dim);">把之前在旧网址「导出全部数据」复制的整段 JSON 粘贴到下面。导入后<strong style="color:var(--red);">当前网址的账本会被整体覆盖</strong>，请确认当前网址没有需要保留的数据。</p>
    <textarea id="importArea" placeholder='粘贴形如 {"_tenacityBase":4,"2026-07-28":{...}} 的导出内容' style="width:100%;height:280px;font-size:11px;font-family:monospace;box-sizing:border-box;white-space:pre;"></textarea>
    <div style="margin-top:10px;display:flex;gap:8px;">
      <button class="popup-close" style="position:static;" onclick="doImportStoreData()">导入并覆盖</button>
      <button class="popup-close" onclick="closePopup()">取消</button>
    </div>
  `);
}

function doImportStoreData() {
  const ta = document.getElementById('importArea');
  const text = ((ta && ta.value) || '').trim();
  if (!text) { showToast('请先粘贴导出的数据'); return; }
  let data;
  try { data = JSON.parse(text); } catch (e) { showToast('解析失败：不是有效的 JSON'); return; }
  // 兼容包装格式 {sleepRuneData_v3:{...}} / {data:{...}} / {store:{...}}
  if (data && typeof data === 'object' && data._tenacityBase === undefined && data._workTenacityBase === undefined) {
    const inner = data[STORAGE_KEY] || data.data || data.store;
    if (inner && typeof inner === 'object') data = inner;
  }
  const dayKeys = data && typeof data === 'object'
    ? Object.keys(data).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k)) : [];
  const hasMeta = data && typeof data === 'object'
    && (data._tenacityBase !== undefined || data._workTenacityBase !== undefined || data._timeTravel !== undefined);
  if (!hasMeta && !dayKeys.length) {
    showToast('格式不对：请粘贴「导出全部数据」弹窗里的完整内容');
    return;
  }
  if (!window.confirm('确定导入吗？\n\n当前网址的账本将被整体覆盖（含 ' + dayKeys.length + ' 天记录）。')) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) { showToast('写入失败：' + e.message); return; }
  loadStore();   // 全套自愈：结构修复、抵押券/冷却误触清理、派生韧性与年结算重算
  saveStore();
  initDayData(currentDate);
  renderAll();
  closePopup();
  showToast('导入成功：' + dayKeys.length + ' 天记录');
}

// ===== Toast =====
let toastTimer;
function showToast(msg) {
  const toast = $('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

function toggleModule(bodyId) {
  const body = $(bodyId);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open');
  // 更新toggle图标
  const toggleEl = bodyId === 'coinBody' ? $('coinToggle') : $('bankToggle');
  if (body.classList.contains('open')) {
    toggleEl.classList.add('open');
  } else {
    toggleEl.classList.remove('open');
  }
}

function toggleSub(bodyId) {
  const body = $(bodyId);
  body.classList.toggle('open');
  // 更新toggle图标
  let toggleEl;
  if (bodyId === 'sleepRuneBody') toggleEl = $('sleepRuneToggle');
  else if (bodyId === 'choresBody') toggleEl = $('choresToggle');
  else if (bodyId === 'preIdBody') toggleEl = $('preIdToggle');
  else if (bodyId === 'exchangeTreeBody') toggleEl = $('exchangeTreeToggle');
  else if (bodyId === 'sleepBankBody') toggleEl = $('sleepBankToggle');
  else if (bodyId === 'workTimeBody') toggleEl = $('workTimeToggle');
  else if (bodyId === 'sleepReviewBody') toggleEl = $('sleepReviewToggle');
  else if (bodyId === 'preIdReviewBody') toggleEl = $('preIdReviewToggle');

  if (body.classList.contains('open')) {
    toggleEl.classList.add('open');
  } else {
    toggleEl.classList.remove('open');
  }
}

function init() {
  loadStore();
  // 初始化当前日期
  const today = todayStr();
  if (!currentDate || currentDate === '') currentDate = today;
  initDayData(currentDate);

  // 默认展开两大系统（子模块默认收起，点击才展开）
  $('coinBody').classList.add('open');
  $('coinToggle').classList.add('open');
  $('bankBody').classList.add('open');
  $('bankToggle').classList.add('open');

  renderAll();

  // 加载即自检：发现不变量被破坏立刻弹横幅报警，而不是默默显示错数
  const problems = selfTest();
  if (problems.length) {
    console.error('[数据自检] 发现问题:', problems);
    showSelfTestBanner(problems);
  }
}

// ===== Twemoji 兜底 =====
if (window.twemoji) {
  // 只给特定的 emoji 容器替换成图片，避免模块标题出现巨大 SVG
  twemoji.parse(document.body, {
    folder: 'svg',
    ext: '.svg',
    callback: function(icon, options, variant) {
      // 跳过模块标题/子模块标题中的 emoji
      var node = options && options.node ? options.node : null;
      if (node) {
        var parent = node.parentElement;
        while (parent) {
          if (parent.classList && (parent.classList.contains('module-header') || parent.classList.contains('sub-header') || parent.classList.contains('header'))) {
            return false;
          }
          parent = parent.parentElement;
        }
      }
      return ''.concat(options.base, options.size, '/', icon, options.ext);
    }
  });
}

// 启动
document.addEventListener('DOMContentLoaded', init);

// 监听存储变化（多标签页同步）
window.addEventListener('storage', function(e) {
  if (e.key === STORAGE_KEY) {
    loadStore();
