<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 强制浏览器不要缓存本页：否则改完代码刷新后拿到的还是旧版 HTML（曾导致修复“看不到效果”） -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="沉眠符咒">
<link rel="manifest" href="manifest.json?v=20260930b">
<link rel="apple-touch-icon" href="icon-192.png?v=20260930b">
<title>💤 沉眠符咒 - 金币系统+银行系统</title>
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js?v=20260930b" crossorigin="anonymous"></script>
<style>
/* ===== CSS 变量 ===== */
:root {
  --bg: #0f0d1a; --bg-card: #1a1726; --bg-card-2: #221d33; --bg-input: #0a0813;
  --border: #3a3358; --border-light: #4a4373; --text: #e8e4f5;
  --text-dim: #9990b8; --text-muted: #6b6488; --accent: #9d7bff;
  --accent-2: #c4a7ff; --accent-dim: #6b4f9e; --gold: #ffd700;
  --gold-dim: #b8960a; --green: #6ee7a0; --red: #ff6b8a;
  --orange: #ffa970; --blue: #7cc4ff; --cyan: #6ee0e0;
}

/* 限制 Twemoji 图片大小 */
img.emoji {
  width: 1.1em;
  height: 1.1em;
  vertical-align: -0.1em;
  display: inline-block;
}
.module-header img.emoji,
.sub-header img.emoji,
.header h1 img.emoji {
  width: 1.2em;
  height: 1.2em;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
  min-height: 100vh; padding: 16px;
}

/* ===== 布局 ===== */
.container { max-width: 900px; margin: 0 auto; }

/* ===== 头部 ===== */
.header { text-align: center; padding: 24px 16px 20px; }
.header h1 {
  font-size: 1.6rem; font-weight: 700; color: var(--accent-2);
  letter-spacing: 0.5em; text-indent: 0.5em;
}
.header .subtitle {
  font-size: 0.8rem; color: var(--text-muted); margin-top: 6px;
}

/* ===== 日期导航 ===== */
.date-nav { margin-bottom: 16px; }
.date-nav input[type="date"] {
  width: 100%; padding: 10px 14px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--bg-input); color: var(--text);
  font-size: 0.95rem; outline: none; margin-bottom: 8px;
  transition: border-color 0.2s;
}
.date-nav input[type="date"]:focus { border-color: var(--accent); }
.date-nav .date-btns { display: flex; gap: 6px; }
.date-nav .date-btns button {
  flex: 1; padding: 8px 0; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg-card); color: var(--text-dim); font-size: 0.85rem;
  cursor: pointer; transition: all 0.2s;
}
.date-nav .date-btns button:hover { background: var(--bg-card-2); color: var(--text); }
.date-nav .date-btns button.today-btn { color: var(--accent-2); font-weight: 600; }

/* ===== 统计栏 ===== */
.stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 12px; text-align: center; cursor: default; transition: border-color 0.2s;
}
.stat-card.clickable { cursor: pointer; }
.stat-card.clickable:hover { border-color: var(--accent); }
.stat-card .stat-label { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; }
.stat-card .stat-value { font-size: 1.25rem; font-weight: 700; color: var(--accent-2); }
.stat-card .stat-value.gold { color: var(--gold); }

/* ===== 模块卡片 ===== */
.module-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
  margin-bottom: 14px; overflow: hidden;
}
.module-header {
  display: flex; align-items: center; gap: 10px; padding: 14px 18px;
  cursor: pointer; user-select: none; transition: background 0.2s;
}
.module-header:hover { background: var(--bg-card-2); }
.module-header .toggle-icon {
  font-size: 0.75rem; color: var(--text-muted); transition: transform 0.3s;
  min-width: 14px; text-align: center;
}
.module-header .toggle-icon.open { transform: rotate(90deg); }
.module-header .module-title { font-weight: 600; color: var(--text); font-size: 0.95rem; }
.module-body { padding: 0 18px 16px; display: none; }
.module-body.open { display: block; }

/* 子模块 */
.sub-module {
  background: var(--bg-card-2); border: 1px solid var(--border); border-radius: 12px;
  margin-bottom: 12px; overflow: hidden;
}
.sub-module:last-child { margin-bottom: 0; }
.sub-header {
  display: flex; align-items: center; gap: 8px; padding: 12px 16px;
  cursor: pointer; user-select: none; transition: background 0.2s;
  font-weight: 600; font-size: 0.88rem; color: var(--text-dim);
}
.sub-header:hover { background: rgba(157, 123, 255, 0.05); }
.sub-header .sub-toggle { font-size: 0.7rem; color: var(--text-muted); transition: transform 0.3s; }
.sub-header .sub-toggle.open { transform: rotate(90deg); }
.sub-body { padding: 0 16px 14px; display: none; }
.sub-body.open { display: block; }

/* 身份回顾 */
.review-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 4px; }
.review-table th { padding: 5px 6px; text-align: center; color: var(--text-muted); border-bottom: 1px solid var(--border); font-weight: 600; }
.review-table td { padding: 5px 6px; border-bottom: 1px solid rgba(58,51,88,0.3); }
.review-table tbody tr:last-child td { border-bottom: none; }

/* ===== 表单元素 ===== */
.form-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.form-row label { font-size: 0.82rem; color: var(--text-dim); white-space: nowrap; }
input[type="number"], input[type="text"], select {
  padding: 6px 10px; border: 1px solid var(--border); border-radius: 7px;
  background: var(--bg-input); color: var(--text); font-size: 0.85rem;
  outline: none; transition: border-color 0.2s;
}
input[type="number"]:focus, input[type="text"]:focus, select:focus { border-color: var(--accent); }
input[type="number"] { width: 70px; }
select { min-width: 80px; }

.radio-group { display: flex; gap: 12px; }
.radio-group label { cursor: pointer; font-size: 0.82rem; color: var(--text-dim); }
.radio-group input[type="radio"] { margin-right: 4px; accent-color: var(--accent); }

/* ===== 技能表 ===== */
.skill-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.82rem; }
.skill-table th {
  padding: 8px 6px; text-align: left; color: var(--text-muted); font-weight: 500;
  border-bottom: 1px solid var(--border); font-size: 0.75rem;
}
.skill-table td { padding: 8px 6px; border-bottom: 1px solid rgba(58,51,88,0.5); }
.skill-table td input[type="number"] { width: 58px; padding: 4px 6px; font-size: 0.8rem; }

/* 技能额外行 */
.skill-extra-row td {
  font-size: 0.8rem; color: var(--text-dim); padding: 8px 12px;
  border-bottom: 1px solid rgba(58,51,88,0.3);
  background: rgba(98, 90, 170, 0.12);
  display: flex; align-items: center; justify-content: center; gap: 12px;
  line-height: 1.6;
}
.skill-extra-row td::before {
  content: "补充说明";
  font-size: 0.85rem; color: var(--accent); font-weight: 600;
  white-space: nowrap; flex-shrink: 0;
}
.skill-extra-row input { width: 50px; padding: 3px 5px; font-size: 0.75rem; }

/* 判定结果颜色 */
.result-badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem;
  font-weight: 600; min-width: 48px; text-align: center;
}
.result-crit { background: rgba(255,215,0,0.15); color: var(--gold); border: 1px solid var(--gold-dim); }
.result-extreme { background: rgba(110,231,160,0.1); color: var(--green); border: 1px solid rgba(110,231,160,0.3); }
.result-hard { background: rgba(110,224,224,0.1); color: var(--cyan); border: 1px solid rgba(110,224,224,0.3); }
.result-normal { background: rgba(124,196,255,0.1); color: var(--blue); border: 1px solid rgba(124,196,255,0.3); }
.result-fail { background: rgba(255,107,138,0.1); color: var(--red); border: 1px solid rgba(255,107,138,0.3); }
.result-fumble { background: rgba(200,50,50,0.15); color: #ff4444; border: 1px solid rgba(200,50,50,0.4); }
.result-pending { color: var(--text-muted); border: 1px dashed var(--border-light); }

.info-btn {
  background: none; border: 1px solid var(--border); border-radius: 5px;
  color: var(--text-muted); cursor: pointer; padding: 2px 8px; font-size: 0.75rem;
  transition: all 0.2s;
}
.info-btn:hover { border-color: var(--accent); color: var(--accent-2); }

/* ===== 琐事标签 ===== */
.chore-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
.chore-row .day-label { font-weight: 600; color: var(--text-dim); min-width: 44px; font-size: 0.82rem; }
.chore-tag {
  padding: 3px 12px; border-radius: 14px; font-size: 0.78rem; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg-input); color: var(--text-dim);
  transition: all 0.2s; user-select: none;
}
.chore-tag.selected {
  background: rgba(157,123,255,0.15); border-color: var(--accent); color: var(--accent-2);
}
.chore-row .day-status {
  font-size: 0.82rem; margin-left: 4px;
}
.chore-row .day-done { color: var(--green); }
.day-done-icon { font-size: 0.9rem; min-width: 20px; }

/* 周四说明 */
.thu-note {
  font-size: 0.7rem; color: var(--text-muted); line-height: 1.6; margin-top: 2px;
  text-align: left;
}
.thu-row { align-items: flex-start !important; }
.thu-tag {
  font-size: 0.68rem !important; color: var(--text-muted) !important;
  opacity: 0.8; padding: 6px 10px !important; white-space: normal !important;
  max-width: 260px;
}
.thu-tag.selected {
  background: rgba(157,123,255,0.15) !important;
  border-color: var(--accent) !important;
  color: var(--accent-2) !important;
  opacity: 1 !important;
}

/* ===== 睡眠银行 ===== */
.sleep-stats { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.sleep-stats-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sleep-stat-card {
  background: var(--bg-card-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; text-align: center;
}
.sleep-stat-card .slabel { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; }
.sleep-stat-card .svalue { font-size: 1.1rem; font-weight: 700; color: var(--accent-2); }
.sleep-stat-card.clickable { cursor: pointer; }
.sleep-stat-card.clickable:hover { border-color: var(--accent); }

.time-selectors { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.time-selector-group { display: flex; align-items: center; gap: 6px; }
.time-selector-group label { font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; }
.time-selector-group select, .time-selector-group input[type="time"] {
  padding: 6px 8px; border: 1px solid var(--border); border-radius: 7px;
  background: var(--bg-input); color: var(--text); font-size: 0.85rem; outline: none;
}
.time-selector-group select { min-width: 55px; width: auto; }
.time-unit { font-size: 0.75rem; color: var(--text-dim); margin: 0 1px; }

/* 打卡 checkbox */
.check-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.check-row input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
.check-row label { font-size: 0.82rem; color: var(--text-dim); cursor: pointer; }

/* 韧性积分区域 */
.tenacity-section {
  margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
}
.tenacity-header {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px;
}
.tenacity-header .t-stat { text-align: center; min-width: 0; }
.tenacity-header .t-stat .t-label { font-size: 0.7rem; color: var(--text-muted); }
.tenacity-header .t-stat .t-value { font-size: 1.05rem; font-weight: 700; color: var(--orange); min-width: 0; }
.tenacity-header .t-stat input#loanInterest:focus { outline: none; border-color: var(--accent); }

.tenacity-checks { margin-bottom: 10px; }
.tenacity-check-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
  font-size: 0.75rem; color: var(--text-dim);
}
.tenacity-check-row .check-icon { font-size: 1rem; min-width: 18px; text-align: center; }

/* ===== 时光穿越技能框 ===== */
.skill-box {
  margin-top: 12px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--bg-card); overflow: hidden;
}
.skill-box-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; cursor: pointer; user-select: none;
  background: rgba(98,90,170,0.10);
  font-size: 0.82rem; font-weight: 400; color: var(--text-muted);
}
.skill-box-header:hover { background: rgba(98,90,170,0.18); }
.skill-box-header .skill-box-name {
  font-size: 0.82rem; font-weight: 400; color: var(--text-muted);
}
.skill-box-cooldown {
  font-size: 0.7rem; color: var(--text-muted); margin-left: auto;
}
.skill-box-body { padding: 12px 14px; }
.skill-box-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid rgba(58,51,88,0.45);
  font-size: 0.78rem; color: var(--text-dim);
}
.skill-box-row:last-child { border-bottom: none; }
.skill-box-row .row-label {
  color: var(--text-muted); font-size: 0.78rem;
}
.skill-box-row .row-val {
  color: var(--text); font-size: 0.86rem; font-weight: 600;
}
.skill-box-row .num-val {
  display: inline-block; min-width: 28px; text-align: center;
  color: var(--orange); font-weight: 700; font-size: 1rem;
}
.skill-box-row input[type="number"] {
  width: 80px; padding: 5px 8px; font-size: 0.85rem;
  background: var(--bg-input); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
}
.skill-box-row input[disabled] {
  color: var(--text-muted); background: var(--bg-input); opacity: 0.7;
}
.skill-box-extra {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px dashed rgba(58,51,88,0.4);
  display: flex; flex-direction: column; gap: 8px;
  font-size: 0.8rem; color: var(--text-dim);
}
.skill-box-extra .voucher-date { color: var(--accent-2); }
.skill-box-extra .btf-line {
  display: flex; justify-content: space-between; align-items: center;
}
.skill-box-extra .btf-line input[type="number"] {
  width: 80px; padding: 5px 8px; font-size: 0.85rem;
  background: var(--bg-input); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
}
.skill-box-extra .btf-line input[disabled] { color: var(--text-muted); opacity: 0.7; }
.streak-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 0.85rem; font-weight: 700; color: var(--orange); background: var(--bg-input);
}
.streak-badge.streak-done { border-color: var(--green); color: var(--green); background: rgba(110,231,160,0.08); }

/* 周结算 */
.weekly-section {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px; margin-top: 10px;
}
.weekly-section .ws-title { font-weight: 600; color: var(--orange); margin-bottom: 10px; font-size: 0.9rem; }
.weekly-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 8px; }
.weekly-table th { padding: 6px; text-align: center; color: var(--text-muted); border-bottom: 1px solid var(--border); }
.weekly-table td { padding: 6px; text-align: center; border-bottom: 1px solid rgba(58,51,88,0.4); }

/* 工作时间银行 */
.work-stats { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.work-tenacity-header {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px;
}
.work-tenacity-header .t-stat {
  display: flex; flex-direction: column; align-items: center; min-width: 0;
}
.work-tenacity-header .t-stat .t-label {
  font-size: 0.75rem; color: var(--text-muted); text-align: center;
}
.work-tenacity-header .t-stat .t-value {
  font-size: 0.9rem; font-weight: 600; color: var(--orange);
  display: flex; align-items: center; justify-content: center; min-height: 28px;
}
.quality-tag {
  padding: 4px 14px; border-radius: 14px; font-size: 0.8rem; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg-input); color: var(--text-dim);
  transition: all 0.2s; user-select: none;
}
.quality-tag.selected {
  background: rgba(157,123,255,0.15); border-color: var(--accent); color: var(--accent-2);
}
.overtime-rules {
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; margin: 8px 0;
  font-size: 0.78rem; color: var(--text-dim); line-height: 1.7;
  display: none; white-space: pre-wrap;
}
.overtime-rules.show { display: block; }

/* ===== 弹窗 ===== */
.popup-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.5); z-index: 1000; display: none;
  justify-content: center; align-items: flex-start; padding-top: 80px;
}
.popup-overlay.show { display: flex; }
.popup-content {
  background: var(--bg-card-2); border: 1px solid var(--border-light); border-radius: 14px;
  padding: 20px; max-width: 420px; width: 90%; max-height: 70vh; overflow-y: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.popup-content h3 { font-size: 0.95rem; margin-bottom: 12px; color: var(--accent-2); }
.popup-content .popup-row {
  display: flex; justify-content: space-between; padding: 6px 0;
  border-bottom: 1px solid rgba(58,51,88,0.4); font-size: 0.82rem;
}
.popup-content .popup-close {
  display: block; margin: 14px auto 0; padding: 6px 24px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card);
  color: var(--text-dim); cursor: pointer; font-size: 0.85rem;
}

/* 技能说明弹窗 */
.skill-info-popup .popup-content { max-width: 360px; }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: var(--accent-dim); color: var(--text); padding: 10px 24px;
  border-radius: 20px; font-size: 0.85rem; z-index: 2000; opacity: 0;
  transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* ===== 响应式 ===== */
@media (max-width: 640px) {
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .sleep-stats { grid-template-columns: repeat(2, 1fr); }
  /* 技能表转卡片式 */
  .skill-table, .skill-table tbody, .skill-table tr, .skill-table td, .skill-table th { display: block; }
  .skill-table thead { display: none; }
  .skill-table tr {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; margin-bottom: 8px;
  }
  .skill-table td {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 0; border: none; gap: 8px;
  }
  .skill-table td::before {
    content: attr(data-label); font-size: 0.72rem; color: var(--text-muted);
    min-width: 60px;
  }
  .time-selectors { flex-direction: column; }
}

/* ===== 兑换树 ===== */
.ex-item { background: rgba(98,90,170,0.08); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
.ex-item-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
.ex-name { font-size: 0.86rem; font-weight: 600; color: var(--text); }
.ex-desc { font-size: 0.74rem; color: var(--text-muted); }
.ex-item-actions { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; overflow: hidden; }
.ex-item-actions .ex-btn { padding: 3px 8px; font-size: 0.76rem; white-space: nowrap; }
.ex-btn { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 4px 10px; font-size: 0.78rem; cursor: pointer; }
.ex-btn:hover { filter: brightness(1.1); }
.ex-btn.ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }

<script>
// ===== 工具函数 =====
function $(id) { return document.getElementById(id); }
function qs(sel, parent) { return (parent || document).querySelector(sel); }
function qsa(sel, parent) { return (parent || document).querySelectorAll(sel); }
function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function parseDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function todayStr() { return fmtDate(new Date()); }

function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  return fmtDate(date);
}

function getDayOfWeek(d) {
  const date = new Date(d);
  return date.getDay(); // 0=周日, 1=周一, ... 6=周六
}

function getDayLabel(d) {
  const labels = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  return labels[getDayOfWeek(d)];
}

// 判断日期类型: 'workday'(工作日) 或 'holiday'(周末/节假日)
function getDayType(dateStr) {
  const Y = Number(dateStr.split('-')[0]);
  // 按年份选用对应法定节假日表（你的数据在 2026 年，必须用 2026 表；
  // 旧代码写死 HOLIDAYS_2025，对 2026 日期字符串匹配不上，导致 2026 节假日漏判）
  let hol = [], ovr = [];
  if (Y === 2025) { hol = HOLIDAYS_2025; ovr = WORKDAY_OVERRIDE_2025; }
  else if (Y === 2026) { hol = HOLIDAYS_2026; ovr = WORKDAY_OVERRIDE_2026; }
  if (hol.includes(dateStr)) return 'holiday';
  if (ovr.includes(dateStr)) return 'workday';
  const dow = getDayOfWeek(parseDate(dateStr));
  return (dow === 0 || dow === 6) ? 'holiday' : 'workday';
}

];

// 计算某物品在给定金额下的消耗金币数
function computeExchangeCost(item, amount) {
  if (item.kind === 'flat') return Number(item.cost) || 0;
  if (item.kind === 'per100') return Math.ceil((Number(amount) || 0) / 100) * (Number(item.per) || 0);
  if (item.kind === 'tiered') {
    const amt = Number(amount) || 0;
    const ts = item.tiers || [];
    for (const t of ts) {
      if (amt <= t.upTo) return Number(t.cost) || 0;
    }
    return ts.length ? (Number(ts[ts.length - 1].cost) || 0) : 0;
  }
  return 0;
}

// 物品计价说明文字
function describeItem(item) {
  if (item.kind === 'flat') return `${item.cost}分`;
  if (item.kind === 'per100') return `每100元消耗${item.per}分`;
  if (item.kind === 'tiered') {
    return (item.tiers || []).map((t, i, arr) => {
      const isLast = i === arr.length - 1;
      const isAbove = (t.upTo === Infinity || t.upTo === null || t.upTo >= 1e9);
      const up = isAbove ? '以上' : `${t.upTo}元`;
      const prefix = (!isAbove && i === 0) ? '≤' : '';
      return `${prefix}${up}${t.cost}分`;
    }).join('，');
  }
  return '';
}

// 工作时间银行

// 技能判定
function judgeSkill(roll, threshold) {
  if (roll === null || roll === undefined || roll === '' || isNaN(roll)) return { result: 'pending', label: '待判定', cls: 'result-pending' };
  const r = Number(roll);
  if (r === 1) return { result: 'crit', label: '大成功', cls: 'result-crit' };
  if (r === 100) return { result: 'fumble', label: '大失败', cls: 'result-fumble' };
  if (r <= threshold / 5) return { result: 'extreme', label: '极难成功', cls: 'result-extreme' };
  if (r <= threshold / 2) return { result: 'hard', label: '困难成功', cls: 'result-hard' };
  if (r <= threshold) return { result: 'normal', label: '普通成功', cls: 'result-normal' };
  return { result: 'fail', label: '失败', cls: 'result-fail' };
}

// ===== 数据管理 =====
let store = {};
let currentDate = todayStr();

function loadStore() {
  let _fixedTen = false; // 标记本轮是否发生过自愈写入，决定是否回写 localStorage
  let _raw = '';
  try {
    _raw = localStorage.getItem(STORAGE_KEY);
    store = _raw ? JSON.parse(_raw) : {};
  } catch (e) { store = {}; }
  // 迁移：持久化层若还残留派生韧性字段（_tenacityToday/_workTenacityToday），
  // 必须强制落盘一次以剥离。否则当内存重算值与残留值“碰巧相等”时，
  // 本轮不会触发 saveStore，自检会一直报“持久化层含派生韧性字段”。
  if (_raw && (/"_tenacityToday"/.test(_raw) || /"_workTenacityToday"/.test(_raw))) _fixedTen = true;
  // 自愈：韧性基数必须用你给定的初始值，绝不被任何历史残留覆盖。
  // 之前某版 bug 曾把 _tenacityBase 写成 -sum 并持久化，导致韧性被改错成 -3 且一直残留；
  // 这里强制重置为初始值（与每日 _tenacityToday 累加得到正确累计韧性）。
  if (store._tenacityBase !== INITIAL_TENACITY) { store._tenacityBase = INITIAL_TENACITY; _fixedTen = true; }
  if (store._workTenacityBase !== INITIAL_WORK_TENACITY) { store._workTenacityBase = INITIAL_WORK_TENACITY; _fixedTen = true; }
  // 确保年结算记录存在
  if (store._sleepYearSettlements === undefined) store._sleepYearSettlements = {};
  if (store._workYearSettlements === undefined) store._workYearSettlements = {};
  // 确保兑换树物品定义存在
  if (store._exchangeItems === undefined) store._exchangeItems = JSON.parse(JSON.stringify(DEFAULT_EXCHANGE_ITEMS));
  // 确保时光穿越技能全局记录存在
  if (store._timeTravel === undefined) store._timeTravel = { lastUseDate: '', lastResult: '' };

  // 自愈：抵押券扣分必须守恒（每次兑换有且仅有一次 -10 落地）。
  // 先修账本，再重算每天的派生韧性，否则 _tenacityToday 会基于错误账本被重算并显错。
  const _vHeal = healVoucherState();
  if (_vHeal.length) { _fixedTen = true; console.info('[数据自愈·抵押券台账]', _vHeal); }

  // 自愈：冷却记录指向的那天并没有真正的投掷值 → 属于误触/半途输入，解除冷却。
  // （旧版「输入即生效」会把随手一点也当成用过技能，凭空锁住两周）
  const _ttHeal = healTimeTravelState();
  if (_ttHeal.length) { _fixedTen = true; console.info('[数据自愈·时光穿越]', _ttHeal); }

  // 自愈：清空所有年结算记录，交给 ensureYearSettlements 用“当前正确规则 + 重置后的基数”
  // 重新生成。否则旧版本/旧 bug 写进来的陈旧结算值（例如基数被偷时算出的 -5000）会一直
  // 残留在 localStorage 里被直接读出，导致“打开没变化”。结算公式是确定性的，重算即正确。
  if (Object.keys(store._sleepYearSettlements || {}).length || Object.keys(store._workYearSettlements || {}).length) _fixedTen = true;
  store._sleepYearSettlements = {};
  store._workYearSettlements = {};

  // 先清理“幽灵空天”：getDayData 在跨年回溯探测打卡连续性时会自动建出 {} 空天，
  // 它们没有任何字段，必须在本轮自愈“之前”就删除——否则下面的自愈会给这些空天
  // 写入 _tenacityToday，把它们伪装成“有数据的一天”，污染年份/月度判定。
  for (const key of Object.keys(store)) {
    if (key.startsWith('_')) continue;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    const d = store[key];
    if (d && !isRealDayData(d)) { delete store[key]; _fixedTen = true; }
  }

  // 自愈：用当前正确的规则从“原始输入”重算每一天的派生韧性（睡眠 + 工作），
  // 清掉之前任何错误重算 / 清零残留的脏值。所有显示值都应由原始输入确定性推导，
  // 不依赖可能被污染的存储派生值，从而保证“每一天”都与最新规则一致、不再漂移。
  // 工作韧性涉及跨天依赖（出差打卡），按日期升序重算以保证一致。
  const _dayKeys = Object.keys(store)
    .filter(k => !k.startsWith('_') && /^\d{4}-\d{2}-\d{2}$/.test(k) && isRealDayData(store[k]))
    .sort();
  for (const key of _dayKeys) {
    const newT = calcTenacityToday(key).total;
    if (store[key]._tenacityToday !== newT) { store[key]._tenacityToday = newT; _fixedTen = true; }
  }
  for (const key of _dayKeys) {
    const newW = calcWorkTenacityToday(key).total;
    if (store[key]._workTenacityToday !== newW) { store[key]._workTenacityToday = newW; _fixedTen = true; }
  }

  // 自愈过程中 calcTenacityToday 会向后回溯探测，可能又建出新的 {} 空天，再清一遍。
  for (const key of Object.keys(store)) {
    if (key.startsWith('_')) continue;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    const d = store[key];
    if (d && !isRealDayData(d)) { delete store[key]; _fixedTen = true; }
  }
  // 无条件保证迁移：用“净化后”的当前状态重写一次 localStorage（派生值/幽灵天会被落盘前剥离）。
  // 不再依赖“是否检测到变化”——避免残留值碰巧相等时漏掉重写、导致自检一直报警。
  // saveStore 内部会跳过“内容未变”的写入，因此多标签页不会互相触发死循环。
  saveStore();

  // 归一化：JSON 序列化会把 Infinity 变成 null，加载后还原为 Infinity
  (store._exchangeItems || []).forEach(it => {
    (it.tiers || []).forEach(t => { if (t.upTo === null || t.upTo === undefined) t.upTo = Infinity; });
  });
}

function saveStore() {
  // 落盘前“净化”：派生值（每日韧性 _tenacityToday/_workTenacityToday、年结算 *_YearSettlements）
  // 只在使用时现算，绝不持久化为权威字段；幽灵天（空天 / 仅含派生字段）也不落盘。
  // 这样 localStorage 永远是“原始输入”，任何计算错误都不会被固化进存储、污染后续读取
  //（这正是之前“加个技能→派生值落盘→被当成真实记录→2024/2025 凭空年积分”的根因）。
  const clean = {};
  for (const key in store) {
    if (key.startsWith('_')) {
      // 年结算为纯派生值，落盘时清空（读取时按公式现算）
      if (key === '_sleepYearSettlements' || key === '_workYearSettlements') { clean[key] = {}; continue; }
      clean[key] = store[key];
      continue;
    }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) { clean[key] = store[key]; continue; }
    const d = store[key];
    if (!isRealDayData(d)) continue; // 幽灵天（空天/仅派生字段）不落盘
    // 真实记录：剥掉派生韧性字段后再落盘
    const copy = {};
    for (const f in d) {
      if (f === '_tenacityToday' || f === '_workTenacityToday') continue;
      copy[f] = d[f];
    }
    clean[key] = copy;
  }
  // 内容未变则不写：避免多标签页 storage 事件互相触发写成死循环，
  // 也避免同一份数据被反复重写。
  const next = JSON.stringify(clean);
  const curRaw = localStorage.getItem(STORAGE_KEY);
  if (next !== curRaw) localStorage.setItem(STORAGE_KEY, next);
}

function getDayData(dateStr) {
  if (!store[dateStr]) store[dateStr] = {};
  return store[dateStr];
}

// ===== 数据自检（加载即跑，发现“不可能状态”立即报警）=====
// 防止再次出现“加个技能就引发积分全部乱套”却没人发现的情况：
// 任何改动评分/韧性/结算的逻辑后，selfTest 会在打开页面时立刻揪出不变量被破坏，
// 而不是默默显示一串错数。返回问题字符串数组（空=健康）。
function selfTest() {
  const problems = [];
  // 1) 韧性基数永不被任何结算/清零逻辑改写（初值即你给的初始值）
  if (store._tenacityBase !== INITIAL_TENACITY)
    problems.push(`睡眠韧性基数异常: ${store._tenacityBase}（应为 ${INITIAL_TENACITY}）`);
  if (store._workTenacityBase !== INITIAL_WORK_TENACITY)
    problems.push(`工作韧性基数异常: ${store._workTenacityBase}（应为 ${INITIAL_WORK_TENACITY}）`);
  // 2) 内存中不得残留“仅含派生字段”的幽灵天（2024/2025 凭空年积分的根因）
  for (const key in store) {
    if (key.startsWith('_')) continue;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    const d = store[key];
    if (d && !isRealDayData(d) && Object.keys(d).length > 0) {
      const onlyDerived = Object.keys(d).every(k => _DERIVED_KEYS.includes(k));
      if (onlyDerived) problems.push(`残留幽灵派生天 ${key}（仅含派生韧性字段，会污染年份/月度）`);
    }
  }
  // 3) 持久化层不得含派生字段 / 幽灵天 / 无真实数据的年结算
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const persisted = JSON.parse(raw);
      for (const key in persisted) {
        if (key.startsWith('_')) continue;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
        const d = persisted[key];
        if (d && !isRealDayData(d)) problems.push(`持久化层含非真实天 ${key}（派生值/幽灵天不应落盘）`);
      }
      for (const S of ['_sleepYearSettlements', '_workYearSettlements']) {
        const obj = persisted[S] || {};
        for (const Y of Object.keys(obj)) {
          if (!yearHasRealData(Number(Y))) problems.push(`持久化层含无真实数据的年结算 ${S}.${Y}`);
        }
      }
      // 派生韧性字段不应出现在持久化层（列出具体日期，便于定位是哪个写入路径还在落盘）
      const badKeys = [];
      for (const key in persisted) {
        if (key.startsWith('_')) continue;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
        const d = persisted[key];
        if (d && ('_tenacityToday' in d || '_workTenacityToday' in d)) badKeys.push(key);
      }
      if (badKeys.length) problems.push(`持久化层含派生韧性字段（应只在读取时现算）：${badKeys.join('、')}`);
    }
  } catch (e) { /* localStorage 不可用时不报错 */ }
  // 4.5) 抵押券规则：勾了就扣当日 -10，不存在任何“自动取消/自动承接”痕迹
  {
    if (store._timeTravel && (store._timeTravel.cancelledVoucherDate !== undefined || store._timeTravel.cancelledLaunchDate !== undefined))
      problems.push('时光穿越残留自动取消记录（旧版机制，加载时应被清除）');
    const moved = Object.keys(store).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k) && store[k] && store[k].voucherMovedIn);
    if (moved.length) problems.push(`残留自动承接标记 voucherMovedIn: ${moved.join('、')}（旧版机制，加载时应被清除）`);
  }
  // 4.6) 使用韧性积分的扣分必须落在 0（未勾）或规则允许的扣分额上
  {
    const amt = voucherDeductionAmount(currentDate);
    const bad = Object.keys(store).filter(k => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return false;
      const day = store[k];
      if (!day || !day.voucherExchanged) return false;
      const v = calcTenacityToday(k).voucher;
      return v !== -voucherDeductionAmount(k);
    });
    if (bad.length) problems.push(`使用韧性积分的扣分与规则不符：${bad.join('、')}`);
    if (currentDate >= VOUCHER_RULE_CHANGE_DATE && (amt < 7 || amt > 10))
      problems.push(`使用韧性积分扣分超出 7~10 范围: ${amt}`);
  }
  // 4) 当前年积分必须是确定性公式值（进行中=基数+分数，不含韧性×24）
  const cy = Number(currentDate.split('-')[0]);
  const yp = calcSleepYearPoints(currentDate);
  const expY = getYearBase(cy, true) + sumYearSleepScores(cy, currentDate);
  if (yp !== expY) problems.push(`当前年睡眠积分与公式不符: ${yp} vs ${expY}`);
  const wp = calcWorkYearPoints(currentDate);
  const expW = getYearBase(cy, false) + sumYearWorkScores(cy, currentDate);
  if (wp !== expW) problems.push(`当前年工作积分与公式不符: ${wp} vs ${expW}`);
  return problems;
}

}

  if (d.preIdSuccess === undefined) d.preIdSuccess = null;
  if (d.preIdCoin === undefined) d.preIdCoin = null;
  if (d.sleepPrepareTime === undefined) d.sleepPrepareTime = '';
  if (d.sleepFallAsleepTime === undefined) d.sleepFallAsleepTime = '';

  if (d.loanActive === undefined) d.loanActive = false;
  if (d.loanInterest === undefined) d.loanInterest = '';
  // 工作时间银行字段
  if (d.workLeaveOnTime === undefined) d.workLeaveOnTime = false;
  if (d.workFocusChecked === undefined) d.workFocusChecked = false;
  if (d.weekendQuality === undefined) d.weekendQuality = '';
  if (d.workOvertime === undefined) d.workOvertime = '';

  if (d._workTenacityToday === undefined) d._workTenacityToday = null;
  // 时光穿越技能当日数据
  if (d.timeTravel === undefined) d.timeTravel = { roll: '', result: '', butterfly: '' };
  if (d.exchangeTree === undefined) d.exchangeTree = [];
  saveStore();
}

// ===== 金币计算 =====
function calcTotalCoinPile() {
  let total = INITIAL_COIN_PILE;
  for (const key in store) {
    if (key.startsWith('_')) continue;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    // 只累计到当前查看日及之前（逐日累计余额，看哪天显示截至那天的金币堆）
    if (key > currentDate) continue;
    const d = store[key];
    if (d.sleepCoin) total += d.sleepCoin;
    if (d.sleepSkillCoin) total += d.sleepSkillCoin;
    if (d.preIdCoin) total += d.preIdCoin;
    if (d.choreCoin) total += d.choreCoin;
    // 兑换树消耗：从金币堆扣除（不计入今日获得金币）
    if (d.exchangeTree) {
      for (const s of d.exchangeTree) total -= (s.cost || 0);
    }
  }
  return total;
}

function calcTodayCoin(dateStr) {

// ===== 睡眠积分计算 =====
// 传入的 dateStr 即该日期自身的睡眠数据，该日期的“昨日睡眠积分”基于这些数据计算
function calcSleepScore(dateStr) {
  const d = getDayData(dateStr);
  if (!d.sleepDuration && d.sleepDuration !== 0) return { duration: 0, prepare: 0, bonus: 0, total: 0 };

  // 如果当天兑换了抵押券，该日睡眠积分不扣不加，但数据仍纳入周统计
  if (d.voucherExchanged) return { duration: 0, prepare: 0, bonus: 0, total: 0 };

  const dur = Number(d.sleepDuration) || 0;
  let durationScore = 0;
  if (dur >= 420 && dur <= 450) {
    durationScore = 0;
  } else if (dur > 450 && dur <= 540) {
    // 大于7.5h且小于等于9h：增加超过7.5h的分钟数积分
    durationScore = dur - 450;
  } else if (dur > 540) {
    // 大于9h：按9h封顶计算（540-450=90）
    durationScore = 540 - 450;
  } else if (dur >= 300 && dur < 420) {
    durationScore = -(420 - dur);
  } else if (dur < 300) {
    durationScore = -(120 + (300 - dur) * 2);
  }

  let prepareScore = 0;
  const EVENING_START = 18 * 60; // 18:00 视为晚上开始
  if (d.sleepPrepareTime) {
    const [h, m] = d.sleepPrepareTime.split(':').map(Number);
    let totalMin = h * 60 + m;
    // 准备睡觉只可能发生在晚上(18:00-23:59)或凌晨(00:00-02:00跨午夜)。
    // 凌晨时间需映射到 24:00 之后才能正确落入“00:00-02:00 扣晚睡分钟数”分支，
    // 否则会被误判为“18:00 之前的白天时间”而加重扣分（如 1:40 误算成 -80 而非 -100）。
    if (totalMin < EVENING_START) {
      totalMin += 24 * 60;
    }
    if (totalMin >= EVENING_START && totalMin < 23 * 60) {
      // 18:00 - 23:00 视为晚上，23:00前加分
      const beforeMin = 23 * 60 - totalMin;
      prepareScore = 60 + beforeMin * 2;
    } else if (totalMin >= 23 * 60 && totalMin < 24 * 60) {
      // 阶段一：23:00 - 00:00
      // 23:00 整点（赶上了整段窗口）记满分 60；
      // 23:00 之后按「距0点的分钟数」每 15 分钟一个刻度、每刻度 10 分，零头舍弃
      if (totalMin === 23 * 60) {
        prepareScore = 60;
      } else {
        const beforeMidnight = 24 * 60 - totalMin;
        prepareScore = Math.floor(beforeMidnight / 15) * 10;
      }
    } else if (totalMin >= 24 * 60 && totalMin < 26 * 60) {
      // 00:00 - 02:00，扣晚睡分钟数（与身份无关，所有身份一视同仁）
      const afterMidnight = totalMin - 24 * 60;
      prepareScore = -afterMidnight;
    } else {
      // 02:00 之后 或 18:00 之前（凌晨到傍晚，都按 2:00 之后加重扣分）
      let after2am;
      if (totalMin >= 26 * 60) {
        // 02:00 之后（跨午夜）
        after2am = totalMin - 26 * 60;
      } else {
        // 18:00 之前（含 02:00-18:00），按距离 02:00 的分钟数
        after2am = totalMin - 2 * 60;
      }
      prepareScore = -(120 + after2am * 2);
    }
  }

  let bonusScore = 0;
  if (d.sleepLightOff) bonusScore += 10;
  if (d.sleepCatGroom) bonusScore += 15;

  return {
    duration: durationScore,
    prepare: prepareScore,
    bonus: bonusScore,
    total: durationScore + prepareScore + bonusScore
  };
}

// 睡眠银行总积分
function calcTotalSleepBank() {
  let total = INITIAL_SLEEP_BANK;
  for (const key in store) {
    if (key.startsWith('_')) continue;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    const score = calcSleepScore(key);
    total += score.total;
  }
  return total;
}

// 月度积分（主卡用）。没有任何真实记录、且当月也未给定初始值的月份
// （即你开始使用前的月份，比如前六个月）返回 null，让界面显示“-”，
// 而不是把 0 当成“有 0 分”误导。
function calcMonthSleepScore(dateStr) {
  const [y, m] = dateStr.split('-').map(Number);
  const month = m;
  // 起始日之前的整月：还没开始统计，显示“-”（即使翻看时建出过全默认的幽灵真实天）
  if (isMonthBeforeStart(y, month)) return null;
  let base = MONTH_INITIALS[month] || 0;
  let hasRecord = false;
  for (const key in store) {
    if (key.startsWith('_')) continue;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    const d = store[key];
    if (!isRealDayData(d)) continue; // 排除幽灵空天 / 仅派生的假数据天
    const [ky, km] = key.split('-').map(Number);
    if (ky === y && km === month) {
      const score = calcSleepScore(key);
      base += score.total;
      hasRecord = true;
    }
  }
  if (!hasRecord && MONTH_INITIALS[month] === undefined) return null;
  return base;
}

// 指定年份、月份累计睡眠积分；该月无任何真实记录时返回 null（用于显示“-”）
function getMonthScore(year, month) {
  // 起始日之前的整月：还没开始统计，显示“-”（即使翻看时建出过全默认的幽灵真实天）
  if (isMonthBeforeStart(year, month)) return null;
  let hasRecord = false;
  let total = MONTH_INITIALS[month] || 0;
  for (const key in store) {
    if (key.startsWith('_')) continue;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    const d = store[key];
    if (!isRealDayData(d)) continue; // 排除幽灵空天 / 仅派生的假数据天（否则空月份会误显 +0）
    const [ky, km] = key.split('-').map(Number);
    if (ky === year && km === month) {
      hasRecord = true;
      const s = calcSleepScore(key);
      total += s.total;
    }
  }
  return hasRecord ? total : null;
}
const MONTH_NAMES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

function getMonthName(m) { return MONTH_NAMES[m - 1] || ''; }

// ===== 工作时间银行积分计算 =====
function calcWorkScore(dateStr) {
  const d = getDayData(dateStr);
  const dayType = getDayType(dateStr);
  let score = 0;
  if (dayType === 'workday') {
    if (d.workLeaveOnTime) score += 15;
  } else {
    if (d.weekendQuality === 'low') score += 20;
    else if (d.weekendQuality === 'mid') score += 40;
    else if (d.weekendQuality === 'high') score += 80;
  }
  const overtime = Number(d.workOvertime) || 0;
  score -= overtime;
  // 出差打卡且工作韧性余额不足 5 分：改扣 500 工作银行积分（不影响加班正常扣除）
  if (d.workBusinessTrip) {
    const before = calcTotalWorkTenacityExcl(dateStr);
    if (before < 5) score -= 500;
  }
  return score;
}

function calcTotalWorkBank() {
  let total = INITIAL_WORK_BANK;
  for (const key in store) {
    if (key.startsWith('_')) continue;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    if (key < WORK_BANK_INIT_DATE) continue;
    total += calcWorkScore(key);
  }
  return total;
}

// 准时下班连续天数（跳过周末/节假日，每满5天清零重新计数）
// 注意：只有当前日期为工作日时才可能获得bonus（周末不打卡准时下班）
function calcWorkPunctualStreak(dateStr) {
  const isWorkday = getDayType(dateStr) === 'workday';
  let totalStreak = 0;
  const cur = parseDate(dateStr);
  for (let i = 0; i < 365; i++) {
    const checkStr = fmtDate(cur);
    if (getDayType(checkStr) === 'holiday') {
      cur.setDate(cur.getDate() - 1);
      continue;
    }
    const d = getDayData(checkStr);
    if (d.workLeaveOnTime) {
      totalStreak++;
      cur.setDate(cur.getDate() - 1);
    } else {
      break;
    }
  }
  const inCycle = totalStreak % 5;
  const streak = inCycle === 0 && totalStreak > 0 ? 5 : inCycle;
  // 只有工作日才获得准时下班bonus
  const bonus = (isWorkday && totalStreak > 0 && totalStreak % 5 === 0) ? 1 : 0;
  return { streak, bonus };
}

// 专注时间>200min连续天数（跳过周末/节假日，每满5天清零重新计数）
// 注意：只有当前日期为工作日时才可能获得bonus
function calcWorkFocusStreak(dateStr) {
  const isWorkday = getDayType(dateStr) === 'workday';
  let totalStreak = 0;
  const cur = parseDate(dateStr);
  for (let i = 0; i < 365; i++) {
    const checkStr = fmtDate(cur);
    if (getDayType(checkStr) === 'holiday') {
      cur.setDate(cur.getDate() - 1);
      continue;
    }
    const d = getDayData(checkStr);
    if (d.workFocusChecked) {
      totalStreak++;
      cur.setDate(cur.getDate() - 1);
    } else {
      break;
    }
  }
  const inCycle = totalStreak % 5;
  const streak = inCycle === 0 && totalStreak > 0 ? 5 : inCycle;
  const bonus = (isWorkday && totalStreak > 0 && totalStreak % 5 === 0) ? 3 : 0;
  return { streak, bonus };
}

// 周末/节假日连续高质量统计
function calcWeekendHighQualityStreak(dateStr) {
  if (getDayType(dateStr) !== 'holiday') return { streak: 0, bonus: 0 };
  const d = getDayData(dateStr);
  if (d.weekendQuality !== 'high') return { streak: 0, bonus: 0 };
  let streak = 1;
  const cur = parseDate(dateStr);
  cur.setDate(cur.getDate() - 1);
  for (let i = 0; i < 365; i++) {
    const checkStr = fmtDate(cur);
    if (getDayType(checkStr) !== 'holiday') break;
    const checkD = getDayData(checkStr);
    if (checkD.weekendQuality === 'high') {
      streak++;
      cur.setDate(cur.getDate() - 1);
    } else break;
  }
  let bonus = 0;
  if (streak === 2) bonus = 2;
  else if (streak >= 3) bonus = 1;
  return { streak, bonus };
}

// 工作韧性总积分（排除指定日期当天的 _workTenacityToday）
function calcTotalWorkTenacityExcl(dateStr) {
  let total = (store._workTenacityBase === undefined) ? INITIAL_WORK_TENACITY : store._workTenacityBase;
  for (const key in store) {
    if (key.startsWith('_')) continue;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    if (key === dateStr) continue;
    if (key > currentDate) continue;
    const t = store[key]._workTenacityToday;
    if (t !== undefined && t !== null && !isNaN(t)) total += t;
  }
  return total;
}

// 今日工作韧性积分
function calcWorkTenacityToday(dateStr) {
  const punctual = calcWorkPunctualStreak(dateStr);
  const focus = calcWorkFocusStreak(dateStr);
  const weekend = calcWeekendHighQualityStreak(dateStr);
  const d = getDayData(dateStr);
  const voucher = d.workVoucher ? -10 : 0;
  let total = punctual.bonus + focus.bonus + weekend.bonus + voucher;
  // 出差打卡：当日扣 5 工作韧性（韧性余额≥5 时）
  if (d.workBusinessTrip) {
    const before = calcTotalWorkTenacityExcl(dateStr);
    if (before >= 5) total -= 5;
  }
  return {
    punctual: punctual.bonus,
    focus: focus.bonus,
    weekend: weekend.bonus,
    voucher: voucher,
    total: total
  };
}

function calcTotalWorkTenacity() {
  return calcTotalWorkTenacityAsOf(currentDate);
}

function calcTotalWorkTenacityAsOf(dateStr) {
  let total = (store._workTenacityBase === undefined) ? INITIAL_WORK_TENACITY : store._workTenacityBase;
  for (const key in store) {
    if (key.startsWith('_')) continue;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    if (key > dateStr) continue;
    const t = store[key]._workTenacityToday;
    if (t !== undefined && t !== null && !isNaN(t)) total += t;
  }
  return total;
}

// ===== 年银行结算 =====
// 睡眠银行韧性折算倍率 24；工作银行韧性折算倍率 12
const SLEEP_SETTLE_RATE = 24;
const WORK_SETTLE_RATE = 12;

// 判断某天是否为“真实记录的一天”。
// 真实一天 = 有任意用户输入字段，或被 app 初始化过（带 sleepSkills 等）。
// 注意排除两类幽灵天：
//  1) {} 空天（getDayData 跨年探测时建出，毫无字段）；
//  2) 仅含派生韧性字段（_tenacityToday / _workTenacityToday）的空天——
//     旧版“批量重算”曾给探测空天写过 _tenacityToday 并持久化，若不当成幽灵，
//     它们会被误判成“有数据”，从而凭空造出 2024/2025 的年积分、并让空月份显示 +0。
const _DERIVED_KEYS = ['_tenacityToday', '_workTenacityToday'];
function isRealDayData(d) {
  if (!d) return false;
  const keys = Object.keys(d);
  if (keys.length === 0) return false;           // 纯空天
  const onlyDerived = keys.every(k => _DERIVED_KEYS.includes(k));
  return !onlyDerived;                            // 只要还有任意其它字段，即为真实记录
}

// 取所有“有真实数据”的年份（升序）。
// 关键修复：必须排除 getDayData 在跨年回溯探测打卡连续性时自动建出的“幽灵天”。
// 否则 2024 这类幽灵年份会被当成“最早数据年份”，偷走 INITIAL_* 基数，
// 导致真实年份（如 2025）的年积分从 -13533 暴跌到 ~-4500（即用户看到的 -5000）。
function getAllDataYears() {
  const set = new Set();
  for (const key in store) {
    if (key.startsWith('_')) continue;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    if (!isRealDayData(store[key])) continue; // 跳过幽灵空天 / 仅派生的假数据天
    set.add(Number(key.split('-')[0]));
  }
  return Array.from(set).sort((a, b) => a - b);
}

// 最早有数据的年份（INITIAL_* 基数归属该年）
function getMinDataYear() {
  const ys = getAllDataYears();
  return ys.length ? ys[0] : Number(currentDate.split('-')[0]);
}

// 年基数：仅有数据的最早年份带 INITIAL_* 基数，其余年份从 0 起算
function getYearBase(year, isSleep) {
  return (year === getMinDataYear()) ? (isSleep ? INITIAL_SLEEP_BANK : INITIAL_WORK_BANK) : 0;
}

// 指定年份的睡眠积分之和（截至 dateStr）
function sumYearSleepScores(year, dateStr) {
  let total = 0;
  for (const key in store) {
    if (key.startsWith('_')) continue;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    if (Number(key.split('-')[0]) !== year) continue;
    if (dateStr && key > dateStr) continue;
    total += calcSleepScore(key).total;
  }
  return total;
}

// 指定年份的工作积分之和（截至 dateStr，遵循 WORK_BANK_INIT_DATE 下限）
function sumYearWorkScores(year, dateStr) {
  let total = 0;
  for (const key in store) {
    if (key.startsWith('_')) continue;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    if (key < WORK_BANK_INIT_DATE) continue;
    if (Number(key.split('-')[0]) !== year) continue;
    if (dateStr && key > dateStr) continue;
    total += calcWorkScore(key);
  }
  return total;
}

// 当前年份睡眠银行年积分（已结算年份直接取记录；否则截至查看日累计）
function calcSleepYearPoints(dateStr) {
  const year = Number(dateStr.split('-')[0]);
  const _S = store._sleepYearSettlements || {};
  if (_S[year] !== undefined) return _S[year];
  return getYearBase(year, true) + sumYearSleepScores(year, dateStr);
}

// 当前年份工作银行年积分（已结算年份直接取记录；否则截至查看日累计）
function calcWorkYearPoints(dateStr) {
  const year = Number(dateStr.split('-')[0]);
  const _W = store._workYearSettlements || {};
  if (_W[year] !== undefined) return _W[year];
  return getYearBase(year, false) + sumYearWorkScores(year, dateStr);
}

// 某年结算分 = 年基数 + 年积分 + 剩余韧性×倍率
// 注意：必须以"该年 12-31"为基准日取数，不能依赖 currentDate（今天），
// 否则跨年查看时会把今年韧性折算进往年结算，或只累计到今天而非全年。
function calcSleepSettlementScore(year) {
  const ref = year + '-12-31';
  return getYearBase(year, true) + sumYearSleepScores(year, ref) + calcTotalTenacityAsOf(ref) * SLEEP_SETTLE_RATE;
}
function calcWorkSettlementScore(year) {
  const ref = year + '-12-31';
  return getYearBase(year, false) + sumYearWorkScores(year, ref) + calcTotalWorkTenacityAsOf(ref) * WORK_SETTLE_RATE;
}

// 【已移除】原先的 clearSleepResilience / clearWorkResilience 会把韧性基数
// （_tenacityBase / _workTenacityBase）改写成 -sum，等于年终清零用户的累计韧性。
// 这是未经你授权擅自加的，会破坏累计韧性显示（例如把韧性变成 -3）并污染年结算。
// 韧性基数就是你在开始使用时给的初始值，应当始终累计，绝不被任何结算逻辑改写。
function noopResilience() {}

// 该年是否“有真实数据”：用与 getAllDataYears 一致的 isRealDayData 判定，
// 排除纯空天以及“仅含派生韧性字段”的幽灵天（旧版批量重算曾给探测空天写过 _tenacityToday，
// 若算作真实数据，会凭空造出 2024/2025 的年积分，污染“累计总积分”）。
function yearHasRealData(Y) {
  for (const key in store) {
    if (key.startsWith('_')) continue;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    if (Number(key.split('-')[0]) !== Y) continue;
    if (isRealDayData(store[key])) return true;
  }
  return false;
}

// 年结算固化：把已真实跨年的往年（Y < 当前年）结算值固化进记录，
// 避免往年结算记录丢失后“年积分”在结算值/累计值之间反复跳变。
// 当前年必须等到 12-31 当天才结算（与历史行为一致）。
// 注意：这里【不再清零韧性基数】——韧性基数是你给的初始值，应始终累计。
function ensureYearSettlements() {
  // 先清理“无真实数据年份”的陈旧结算记录（如探测产生的幽灵 2024 记录），
  // 否则这些假记录会混进“累计总积分”。
  for (const Y of Object.keys(store._sleepYearSettlements).map(Number)) {
    if (!yearHasRealData(Y)) delete store._sleepYearSettlements[Y];
  }
  for (const Y of Object.keys(store._workYearSettlements).map(Number)) {
    if (!yearHasRealData(Y)) delete store._workYearSettlements[Y];
  }

  const cur = parseDate(currentDate);
  const curYear = cur.getFullYear();
  const isCurYearEnd = (cur.getFullYear() === curYear && cur.getMonth() === 11 && cur.getDate() === 31);
  const years = getAllDataYears().filter(Y => yearHasRealData(Y));
  let changed = false;
  for (const Y of years) {
    if (store._sleepYearSettlements[Y] !== undefined) continue;
    // 往年（已真实跨年）或当前年恰逢 12-31：结算并固化
    if (Y < curYear || (Y === curYear && isCurYearEnd)) {
      store._sleepYearSettlements[Y] = calcSleepSettlementScore(Y);
      changed = true;
    }
  }
  for (const Y of years) {
    if (store._workYearSettlements[Y] !== undefined) continue;
    if (Y < curYear || (Y === curYear && isCurYearEnd)) {
      store._workYearSettlements[Y] = calcWorkSettlementScore(Y);
      changed = true;
    }
  }
  if (changed) saveStore();
}

// ===== 韧性积分计算 =====

// 「准备睡觉时间」连击规则变更日：2026-09-14 起阈值由 ≤23:00(+1) 改为 ≤22:30(+2)。
// 说明：09-13 那天记录的是「09-12 晚→09-13 早」的睡眠，那一晚规则尚未变更，
// 所以 09-13 仍按旧规则判；09-14 记录的是「09-13 晚→09-14 早」，是新规则第一晚。
// 该日之前的日期仍按旧规则 ≤23:00(+1) 计算，保证历史规则与积分统计不变；
// 且连击计数逐日按「当天生效的规则」判定，因此 09-14 会自然继承 09-13 的连击进度。
const PREP_RULE_CHANGE_DATE = '2026-09-14';

// 「准备睡觉时间是否达标」：按日期选用对应阈值。
//  - 2026-09-13 起：≤22:30（totalMin<=1350）
//  - 之前：≤23:00（totalMin<=1380）
// 下界统一为 20:00（防止把凌晨等不合理时间算作"准备睡觉"）。
function isPrepareSleepOnTime(d, dateStr) {
  if (!d.sleepPrepareTime) return false;
  const [h, m] = d.sleepPrepareTime.split(':').map(Number);
  const totalMin = h * 60 + m;
  const isNewRule = !!dateStr && dateStr >= PREP_RULE_CHANGE_DATE;
  const upper = isNewRule ? (22 * 60 + 30) : (23 * 60);
  return totalMin >= 20 * 60 && totalMin <= upper;
}

// 「准备睡觉连击」完成时发放的分值：2026-09-13 起 +2，之前 +1。
function prepareStreakBonus(dateStr) {
  return (dateStr >= PREP_RULE_CHANGE_DATE) ? 2 : 1;
}

function calcTenacityToday(dateStr) {
  // 检查三项连续打卡
  let t1 = 0, t2 = 0, t3 = 0;

  // 打卡1: 连续3天睡眠时长>=450
  if (checkConsecutive(dateStr, 3, (d) => Number(d.sleepDuration) >= 450)) t1 = 1;

  // 打卡2: 连续3天准备睡觉时间达标（2026-09-13 前 ≤23:00 记 +1；之后 ≤22:30 记 +2）
  if (checkConsecutive(dateStr, 3, isPrepareSleepOnTime)) t2 = prepareStreakBonus(dateStr);

  // 打卡3: 连续3天入睡时间<=00:00，且入睡时间在20:00-23:59范围内
  if (checkConsecutive(dateStr, 3, (d) => {
    if (!d.sleepFallAsleepTime) return false;
    const [h, m] = d.sleepFallAsleepTime.split(':').map(Number);
    const totalMin = h * 60 + m;
    return totalMin >= 20 * 60 && totalMin <= 23 * 60 + 59;
  })) t3 = 3;

  const d = getDayData(dateStr);

  // 使用韧性积分（即「是否兑换抵押券」勾选）的扣分：
  //   2026-09-28 之前：固定 -10（历史不变）
  //   2026-09-28 起：按当日「准备睡觉时间」浮动 ——
  //     · 未填准备睡觉时间 → 扣满 10 分
  //     · ≤02:00 → 7 分
  //     · 02:00 之后每超 1 小时多扣 0.5 分（不满 1 小时按 1 小时算），封顶 10 分
  //       02:01–03:00 → 7.5；03:01–04:00 → 8；04:01–05:00 → 8.5；
  //       05:01–06:00 → 9；06:01–07:00 → 9.5；07:01 以后 → 10
  const voucher = d.voucherExchanged ? -voucherDeductionAmount(dateStr) : 0;

  // 贷款利息：勾选「贷款中」时，按当天填写的数额扣除韧性积分
  const loanAmt = d.loanActive ? (Number(d.loanInterest) || 0) : 0;
  const loan = loanAmt > 0 ? -loanAmt : 0;

  // 时光穿越·蝴蝶效应 1d3：当日韧性额外扣除
  const butterfly = (d.timeTravel && d.timeTravel.butterfly !== '' && d.timeTravel.butterfly != null && d.timeTravel.butterfly !== '-')
    ? Number(d.timeTravel.butterfly) : 0;
  const btfVal = butterfly > 0 ? -butterfly : 0;

  // 周结算加分（仅周日触发）
  let weekly = 0;
  const dow = getDayOfWeek(parseDate(dateStr));
  if (dow === 0) {
    const w = calcWeeklyTenacity(dateStr);
    weekly = w.w1 + w.w2;
  }

  return { t1, t2, t3, voucher, loan, butterfly: btfVal, weekly, total: t1 + t2 + t3 + voucher + loan + btfVal + weekly };
}

// 「使用韧性积分」（抵押券勾选）的规则变更日：2026-09-28 起按准备睡觉时间浮动扣分
const VOUCHER_RULE_CHANGE_DATE = '2026-09-28';

// 某日「使用韧性积分」的扣分额（正数，扣分时取负）
//  - 规则变更日之前：固定 10
//  - 变更日起：
//      未填准备睡觉时间 → 10（扣满）
//      ≤02:00 → 7
//      之后每超 1 小时 +0.5（不满 1 小时按 1 小时算），封顶 10
function voucherDeductionAmount(dateStr) {
  if (!dateStr || dateStr < VOUCHER_RULE_CHANGE_DATE) return 10;
  const d = getDayData(dateStr);
  const t = d.sleepPrepareTime;
  if (!t) return 10;
  const [h, m] = String(t).split(':').map(Number);
  if (isNaN(h) || isNaN(m)) return 10;
  const totalMin = h * 60 + m;
  const baseMin = 2 * 60; // 02:00
  if (totalMin <= baseMin) return 7;
  const overMin = totalMin - baseMin;
  const extraHours = Math.ceil(overMin / 60);   // 不满 1 小时按 1 小时算
  const amt = 7 + extraHours * 0.5;
  return Math.min(10, amt);
}

// 界面文案：说明这次扣了多少、以及为什么
function voucherDeductionNote(dateStr) {
  const amt = voucherDeductionAmount(dateStr);
  if (!dateStr || dateStr < VOUCHER_RULE_CHANGE_DATE) return '使用1张抵押券（-10韧性积分，已计入本日）';
  const d = getDayData(dateStr);
  const t = d.sleepPrepareTime;
  if (!t) return '使用韧性积分：未填准备睡觉时间，扣满 -10韧性积分（已计入本日）';
  return `使用韧性积分：准备睡觉时间 ${t}，扣除 -${amt} 韧性积分（已计入本日）`;
}

// ===== 抵押券台账 =====
// 规则（以你的实际操作为准）：勾了抵押券就扣当天的 -10；
// 时光穿越是否取消它，完全由你手动回到那天改勾选框决定，页面只记录判定与蝴蝶效应。
function getVoucherDays() {
  const days = Object.keys(store)
    .filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k))
    .sort();
  const exchanged = days.filter(k => store[k] && store[k].voucherExchanged);
  return { days, exchanged };
}

// 清理旧版本遗留的“自动取消/自动承接”痕迹（v2.1 早前版本曾自作主张搬动 -10，
// 这正是 9.12 抵押券扣分“回滚”的根因）。加载时无条件清掉，让每张券回到“勾了就扣”。
function healVoucherState() {
  const notes = [];
  const tt = store._timeTravel || (store._timeTravel = { lastUseDate: '', lastResult: '' });
  if (tt.cancelledVoucherDate !== undefined) { delete tt.cancelledVoucherDate; notes.push('清除旧版自动取消记录 cancelledVoucherDate'); }
  if (tt.cancelledLaunchDate !== undefined) { delete tt.cancelledLaunchDate; notes.push('清除旧版记录 cancelledLaunchDate'); }
  for (const k of Object.keys(store)) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
    if (store[k] && store[k].voucherMovedIn) { delete store[k].voucherMovedIn; notes.push(`清除旧版自动承接标记：${k}`); }
  }
  return notes;
}

// 修正时光穿越的“不可能状态”：有冷却记录，但那天根本没有投掷值
function healTimeTravelState() {
  const notes = [];
  const u = store._timeTravel || (store._timeTravel = { lastUseDate: '', lastResult: '' });
  if (u.lastUseDate) {
    const d = store[u.lastUseDate];
    const roll = d && d.timeTravel ? d.timeTravel.roll : undefined;
    if (roll === undefined || roll === null || roll === '') {
      notes.push(`清除无效的技能使用记录：${u.lastUseDate}（当天没有投掷值，属误触）`);
      u.lastUseDate = '';
      u.lastResult = '';
    }
  }
  return notes;
}

// 重算全部「真实日」的派生韧性（不新建任何空天）
function refreshTenacityDerived() {
  for (const k of Object.keys(store)) {
    if (k.startsWith('_')) continue;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
    if (!isRealDayData(store[k])) continue;
    store[k]._tenacityToday = calcTenacityToday(k).total;
  }
}

// 检查某天的前一天是否为不眠者（身份10）
function isPrevDayInsomniac(dateStr) {
  const prevDate = getPrevDateStr(dateStr);
  const prevData = getDayData(prevDate);
  return Number(prevData.sleepIdentity) === 10;
}

// 计算连续天数（从 dateStr 往前数，包括当天）
// 如果前一天是不眠者，当天暂停统计，连续天数保持不变
function countConsecutive(dateStr, checkFn) {
  // 如果前一天是不眠者，跳过当天，从前一天继续往前数
  if (isPrevDayInsomniac(dateStr)) {
    const prevDate = getPrevDateStr(dateStr);
    return countConsecutive(prevDate, checkFn);
  }

  const d = parseDate(dateStr);
  let count = 0;
  for (let i = 0; i < 365; i++) {
    const checkDate = new Date(d);
    checkDate.setDate(checkDate.getDate() - i);
    const checkStr = fmtDate(checkDate);
    const dayData = getDayData(checkStr);

    // 如果当前检查天的前一天是不眠者，跳过当前天（暂停一天）
    if (i > 0 && isPrevDayInsomniac(checkStr)) {
      continue;
    }

    // 把日期一并传给判定函数：部分规则按日期切换阈值（如准备睡觉时间的规则变更）
    if (checkFn(dayData, checkStr)) {
      count++;
    } else {
      break;
    }
  }
  return count;
}

function checkConsecutive(dateStr, n, checkFn) {
  // 连续 n 天达标时仅在第 n 天、第 2n 天……触发奖励（满 n 天清零重新累计）
  const total = countConsecutive(dateStr, checkFn);
  return total > 0 && total % n === 0;
}

// 计算当前连续周期内的天数（每满 3 天清零，用于界面显示 1/2/3）
function getStreakCycleCount(dateStr, checkFn) {
  const total = countConsecutive(dateStr, checkFn);
  return ((total - 1) % 3) + 1;
}

function calcTotalTenacity() {
  return calcTotalTenacityAsOf(currentDate);
}

// 截止到指定日期（含）的韧性总额；用于年结算时按"该年 12-31"而非"今天"取数，
// 避免往年结算把今年（及以后）的韧性也折算进去。
function calcTotalTenacityAsOf(dateStr) {
  let total = (store._tenacityBase === undefined) ? INITIAL_TENACITY : store._tenacityBase;
  for (const key in store) {
    if (key.startsWith('_')) continue;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    if (key > dateStr) continue;
    const t = store[key]._tenacityToday;
    if (t !== undefined && t !== null && !isNaN(t)) total += t;
  }
  return total;
}

// ===== 时光穿越技能 =====
// 独立判定：投掷 1=大成功、108=大失败、≤30=成功、31-99=失败；没有极难/困难/普通分级
function judgeTimeTravel(roll) {
  if (roll === null || roll === undefined || roll === '' || isNaN(roll)) return { result: 'pending', label: '待判定', cls: 'result-pending' };
  const r = Number(roll);
  if (r === 1) return { result: 'crit', label: '大成功', cls: 'result-crit' };
  if (r === 108) return { result: 'fumble', label: '大失败', cls: 'result-fumble' };
  if (r <= 30) return { result: 'normal', label: '成功', cls: 'result-normal' };
  return { result: 'fail', label: '失败', cls: 'result-fail' };
}

// 冷却结束日期（YYYY-MM-DD）；未使用过返回 null
function getTimeTravelCooldownEnd() {
  const u = store._timeTravel;
  if (!u || !u.lastUseDate) return null;
  const days = u.lastResult === 'fumble' ? 30 : 14;
  const end = parseDate(u.lastUseDate);
  end.setDate(end.getDate() + days);
  return fmtDate(end);
}

// 当前查看日是否处于冷却期（用于技能交互：当天使用后仍可展开查看结果，仅后续日期视为冷却）
function isTimeTravelCooling(dateStr) {
  const u = store._timeTravel;
  if (!u || !u.lastUseDate) return false;
  const days = u.lastResult === 'fumble' ? 30 : 14;
  const last = parseDate(u.lastUseDate);
  last.setDate(last.getDate() + days);
  const endStr = fmtDate(last);
  // 仅当查看日严格晚于最后一次使用日，且未超过冷却截止日时视为冷却
  return dateStr > u.lastUseDate && dateStr <= endStr;
}

// 倒推最近一次使用抵押券的日期（不含当天发动日；从前一天开始找）
function findLastVoucherDate(dateStr) {
  const cur = parseDate(dateStr);
  cur.setDate(cur.getDate() - 1); // 从前一天开始
  for (let i = 0; i < 365; i++) {
    const d = new Date(cur);
    d.setDate(d.getDate() - i);
    const s = fmtDate(d);
    const day = getDayData(s);
    if (day.voucherExchanged) {
      return s;
    }
  }
  return null;
}

// 切换技能框展开/折叠（冷却期不允许展开）
let timeTravelOpen = false;
function toggleTimeTravel() {
  if (isTimeTravelCooling(currentDate)) return;
  timeTravelOpen = !timeTravelOpen;
  renderTenacity();
}

// ===== 时光穿越：投掷值必须「先填草稿、再点确认」才生效 =====
// 之前输入框一改就立刻落库并进冷却，点一下数字框的上下箭头（空→1＝大成功）
// 也会被视为用过技能、凭空进入 14 天冷却（用户反馈“我没用却在冷却中”）。
// 现在：改输入框只改草稿，不写库、不进冷却；点「确认」才真正记录。
let _ttDraft = {};

function timeTravelShownRoll(dateStr) {
  if (_ttDraft[dateStr] !== undefined) return _ttDraft[dateStr];
  const d = getDayData(dateStr);
  const r = d.timeTravel ? d.timeTravel.roll : undefined;
  return (r === undefined || r === null) ? '' : r;
}

// 输入框变更：只更新草稿（不落库、不触发冷却）
function onTimeTravelRollChange(value) {
  _ttDraft[currentDate] = (value === '' || value === null) ? '' : Number(value);
  renderTenacity();
}

// 点「确认」才把草稿写入：记录投掷值/判定/冷却，但绝不搬动任何积分。
// 时光穿越的「取消上次抵押券」由你本人手动回到那天改勾选框完成，页面绝不代替操作。
function confirmTimeTravelRoll() {
  const v = timeTravelShownRoll(currentDate);
  delete _ttDraft[currentDate];
  applyTimeTravelRoll(v);
}

function applyTimeTravelRoll(value) {
  const d = getDayData(currentDate);
  const v = (value === '' || value === null) ? '' : Number(value);
  d.timeTravel.roll = v;
  const j = judgeTimeTravel(v);
  d.timeTravel.result = j.result;

  // 触发冷却：成功 / 大成功 / 大失败 都视为「使用过」技能
  if (j.result === 'normal' || j.result === 'crit' || j.result === 'fumble') {
    // 若之前尚未记录（或本次日期更晚），更新最后一次使用
    const last = store._timeTravel;
    if (!last.lastUseDate || currentDate >= last.lastUseDate) {
      store._timeTravel.lastUseDate = currentDate;
      store._timeTravel.lastResult = j.result;
    }
    // 大失败：清空蝴蝶效应（不允许输入）
    if (j.result === 'fumble') d.timeTravel.butterfly = '';
    // 大成功：自动显示"-"，用户不可输入
    if (j.result === 'crit') d.timeTravel.butterfly = '-';
  } else if (j.result === 'fail' || j.result === 'pending') {
    // 普通失败 / 清空投掷：技能未发动，无蝴蝶效应输入；
    // 若冷却记录正好来自本日，说明这次并没有真的用技能 → 撤销该记录。
    d.timeTravel.butterfly = '';
    undoTimeTravelUsageIfFrom(currentDate);
  }
  refreshTenacityDerived();
  saveStore();
  renderTenacity();
}

// 清空本日投掷（撤销这次使用）
function clearTimeTravelRoll() {
  const d = getDayData(currentDate);
  d.timeTravel.roll = '';
  d.timeTravel.result = 'pending';
  d.timeTravel.butterfly = '';
  delete _ttDraft[currentDate];
  undoTimeTravelUsageIfFrom(currentDate);
  refreshTenacityDerived();
  saveStore();
  renderTenacity();
  showToast('已清空本日投掷，冷却记录同步撤销');
}

// 若全局「最后使用」记录来自这一天，就把它撤销（解除冷却）
function undoTimeTravelUsageIfFrom(dateStr) {
  const u = store._timeTravel;
  if (u && u.lastUseDate === dateStr) { u.lastUseDate = ''; u.lastResult = ''; }
}

// 一键解除冷却：清掉全局「最后使用」记录，并抹掉那天残留的投掷/蝴蝶效应值
function clearTimeTravelUsage() {
  const u = store._timeTravel || (store._timeTravel = { lastUseDate: '', lastResult: '' });
  const day = u.lastUseDate;
  u.lastUseDate = '';
  u.lastResult = '';
  if (day && store[day] && store[day].timeTravel) {
    store[day].timeTravel.roll = '';
    store[day].timeTravel.result = 'pending';
    store[day].timeTravel.butterfly = '';
  }
  refreshTenacityDerived();
  saveStore();
  renderTenacity();
  showToast('已清除技能使用记录，冷却解除');
}

// 蝴蝶效应 1d3 输入：校验 1-3，落库并重算韧性
function onButterflyChange(value) {
  const d = getDayData(currentDate);
  const v = (value === '' || value === null) ? '' : Number(value);
  if (v !== '' && (v < 1 || v > 3)) return;
  d.timeTravel.butterfly = v;
  saveStore();
  renderTenacity();
}

    html += `<div class="skill-box-row"><span class="row-label">技能数值</span><span class="num-val">30</span></div>`;
    // 行 3：投掷值（草稿）+ 确认 / 清空
    html += `<div class="skill-box-row"><span class="row-label">投掷值</span><span style="display:flex;align-items:center;gap:4px;">

    if (confirmedResult === 'normal' || confirmedResult === 'crit') {

        : '暂无抵押券使用记录';

// 该日是否“用抵押券抵扣了睡眠数据”：抵扣当天不参与周统计
// （显示为“-”，周平均只用其余天数）。若时光穿越后你手动取消了勾选，该日自然恢复计入。
function isVoucherOffset(dateStr) {
  const d = getDayData(dateStr);
  return !!d.voucherExchanged;
}

// 周结算检查
function calcWeeklyTenacity(dateStr) {
  const d = parseDate(dateStr);
  const currentMonday = new Date(d);
  const day = currentMonday.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  currentMonday.setDate(currentMonday.getDate() + diff);

  const prevMonday = new Date(currentMonday);
  prevMonday.setDate(prevMonday.getDate() - 7);

  // 收集本周数据
  const thisWeekData = [];
  const lastWeekData = [];
  for (let i = 0; i < 7; i++) {
    const td = new Date(currentMonday);
    td.setDate(td.getDate() + i);
    const tdStr = fmtDate(td);
    const dayData = getDayData(tdStr);
    const tdVoucher = isVoucherOffset(tdStr); // 用了抵押券 → 当天睡眠数据不计入周统计
    thisWeekData.push({
      date: tdStr,
      label: getDayLabel(td),
      duration: tdVoucher ? 0 : (Number(dayData.sleepDuration) || 0),
      fallAsleep: tdVoucher ? '' : (dayData.sleepFallAsleepTime || ''),
      voucher: tdVoucher
    });

    const pd = new Date(prevMonday);
    pd.setDate(pd.getDate() + i);
    const pdStr = fmtDate(pd);
    const pDayData = getDayData(pdStr);
    const pdVoucher = isVoucherOffset(pdStr);
    lastWeekData.push({
      date: pdStr,
      label: getDayLabel(pd),
      duration: pdVoucher ? 0 : (Number(pDayData.sleepDuration) || 0),
      fallAsleep: pdVoucher ? '' : (pDayData.sleepFallAsleepTime || ''),
      voucher: pdVoucher
    });
  }

  // 计算平均
  const thisWeekDurations = thisWeekData.filter(x => x.duration > 0).map(x => x.duration);
  const lastWeekDurations = lastWeekData.filter(x => x.duration > 0).map(x => x.duration);

  const thisAvgDur = thisWeekDurations.length ? thisWeekDurations.reduce((a,b)=>a+b,0) / thisWeekDurations.length : 0;
  const lastAvgDur = lastWeekDurations.length ? lastWeekDurations.reduce((a,b)=>a+b,0) / lastWeekDurations.length : 0;

  let w1 = 0, w2 = 0;
  let w1Reason = '', w2Reason = '';

  // w1：睡眠时长积分
  // 规则A：本周比上周多 ≥ 10min → +3
  // 隐藏规则B：即使没多10min，但两周平均都 > 8h(480min) → 也 +3
  if (thisAvgDur > 0 && lastAvgDur > 0) {
    if (thisAvgDur - lastAvgDur >= 10) {
      w1 = 3; w1Reason = '比上周多≥10min';
    } else if (thisAvgDur > 480 && lastAvgDur > 480) {
      w1 = 3; w1Reason = '两周均>8h';
    }
  }

  // 平均入睡时间（带符号：18:00-23:59 → 距0点负分钟；00:00=0；0点之后 → 正分钟）
  const toSignedSleepMin = (t) => {
    const [h, m] = t.split(':').map(Number);
    const totalMin = h * 60 + m;
    if (h >= 18 && h <= 23) return -(24 * 60 - totalMin); // 18:00-23:59 → 距0点负值
    return totalMin; // 00:00-17:59 → 距0点正值
  };
  const thisSleepTimes = thisWeekData.filter(x => x.fallAsleep).map(x => toSignedSleepMin(x.fallAsleep));
  const lastSleepTimes = lastWeekData.filter(x => x.fallAsleep).map(x => toSignedSleepMin(x.fallAsleep));

  const thisHasData = thisSleepTimes.length > 0;
  const lastHasData = lastSleepTimes.length > 0;
  const thisAvgSleep = thisHasData ? thisSleepTimes.reduce((a,b)=>a+b,0) / thisSleepTimes.length : 0;
  const lastAvgSleep = lastHasData ? lastSleepTimes.reduce((a,b)=>a+b,0) / lastSleepTimes.length : 0;

  // w2：入睡时间韧性积分
  // 规则A：本周比上周早 ≥ 30min → +3
  // 隐藏规则B：即使没早30min，但两周平均都 ≤ 23:30(signed ≤ -30) → 也 +3
  if (thisHasData && lastHasData) {
    if (lastAvgSleep - thisAvgSleep >= 30) {
      w2 = 3; w2Reason = '比上周早≥30min';
    } else if (thisAvgSleep <= -30 && lastAvgSleep <= -30) {
      w2 = 3; w2Reason = '两周均≤23:30';
    }
  }

  return {
    w1, w2, w1Reason, w2Reason,
    thisWeek: thisWeekData,
    lastWeek: lastWeekData,
    thisAvgDur, lastAvgDur,
    thisAvgSleep, lastAvgSleep,
    thisHasData, lastHasData
  };
}

// ===== 身份回顾 =====
function getIdentityStats(system) {
  const stats = {};
  for (let i = 1; i <= 10; i++) stats[i] = { success: 0, fail: 0 };
  for (const key in store) {
    if (key.startsWith('_')) continue;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    const d = store[key];
    if (system === 'sleep') {
      const id = Number(d.sleepIdentity);
      if (id >= 1 && id <= 10) {
        if (d.sleepSuccess === 'yes') stats[id].success++;
        else if (d.sleepSuccess === 'no') stats[id].fail++;
      }
    } else {
      const id = Number(d.preIdIdentity);
      if (id >= 1 && id <= 10) {
        if (d.preIdSuccess === 'yes') stats[id].success++;
        else if (d.preIdSuccess === 'no') stats[id].fail++;
      }
    }
  }
  return stats;
}

function renderIdentityReview(system) {
  const bodyId = system === 'sleep' ? 'sleepReviewBody' : 'preIdReviewBody';
  const body = $(bodyId);
  if (!body) return;
  const names = system === 'sleep' ? IDENTITY_NAMES : PRE_ID_TASKS;
  const stats = getIdentityStats(system);
  let rows = '';
  for (let i = 1; i <= 10; i++) {
    rows += `<tr>
      <td style="text-align:center;">${i}</td>
      <td>${escapeHtml(names[i] || '—')}</td>
      <td style="text-align:center;color:var(--green);">${stats[i].success}</td>
      <td style="text-align:center;color:var(--red);">${stats[i].fail}</td>
    </tr>`;
  }
  body.innerHTML = `<table class="review-table">
    <thead><tr><th>序号</th><th>名称</th><th>扮演成功次数</th><th>扮演失败次数</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function showCoinBreakdown() {
  const d = getDayData(currentDate);

    const j = judgeSkill(catSkill, 65);

    const extras = d.sleepSkillExtras || {};

    else if (j.result === 'normal') catCoin = (Number(extras['芭丝特的祝福_d3']) || 0) * 0.1;
    else if (j.result === 'hard') catCoin = (Number(extras['芭丝特的祝福_d3']) || 0) * 0.2;

  const wjjcgSkill = d.sleepSkills ? d.sleepSkills['握烬成光'] : undefined;
  if (d.sleepSuccess === 'no' && wjjcgSkill !== undefined && wjjcgSkill !== null && wjjcgSkill !== '') {
    const j = judgeSkill(wjjcgSkill, 40);
    if (j.result === 'crit' || j.result === 'extreme' || j.result === 'hard' || j.result === 'normal') {
      const extras = d.sleepSkillExtras || {};

  showPopup(`

// ===== 1.1 沉眠符咒渲染 =====
function renderSleepRune() {
  const d = getDayData(currentDate);
  const prevDate = getPrevDateStr(currentDate);
  const prevD = getDayData(prevDate);
  const prevId = Number(prevD.sleepIdentity) || 0;

  // 身份
  $('sleepIdentity').value = d.sleepIdentity || '';
  $('sleepIdentityName').textContent = d.sleepIdentity ? (IDENTITY_NAMES[Number(d.sleepIdentity)] || '') : '';

  // 技能表
  let rows = '';
  const currentId = Number(d.sleepIdentity) || 0;

  SLEEP_SKILLS.forEach((sk, i) => {
    // 技能显示条件判断
    if (sk.name === '欺瞒' && currentId !== 1) return; // 仅守夜人
    if (sk.name === '延时响应' && (currentId === 1 || currentId === 10 || currentId === 0)) return; // 非守夜人和不眠者
    if (sk.name === '句号' && ![2, 3, 4, 8, 9].includes(prevId)) return; // 前一天身份为2,3,4,8,9
    if (sk.name === '芭丝特的祝福' && currentId !== 6) return; // 仅驯兽师

    const roll = d.sleepSkills ? d.sleepSkills[sk.name] : undefined;
    const j = judgeSkill(roll, sk.threshold);

    let nameCell = sk.name;

    rows += `<tr>
      <td data-label="技能名称">${nameCell}</td>
      <td data-label="技能数值">${sk.threshold}</td>
      <td data-label="投掷值"><input type="number" min="1" max="100" value="${roll !== undefined ? roll : ''}" onchange="onSleepSkillChange('${sk.name}', this.value)"></td>
      <td data-label="判定结果"><span class="result-badge ${j.cls}">${j.label}</span></td>
      <td data-label="说明"><button class="info-btn" onclick="showSkillInfo('${sk.name}')">说明</button></td>
    </tr>`;

    // 额外行渲染
    rows += renderSkillExtraRow(sk.name, j.result, d, sk.threshold);

    // 句号技能的固定提示行（仅当已投掷/使用该技能时显示）
    if (sk.name === '句号' && roll != null && roll !== '') {
      rows += `<tr class="skill-extra-row"><td colspan="5">不能在自选身份的次日使用<br>不能连续两日使用</td></tr>`;
    }
  });
  $('sleepSkillTable').innerHTML = rows;

  // 成功radio
  const yesRadio = qs('#sleepSuccessGroup input[value="yes"]');
  const noRadio = qs('#sleepSuccessGroup input[value="no"]');
  if (d.sleepSuccess === 'yes') yesRadio.checked = true;
  else if (d.sleepSuccess === 'no') noRadio.checked = true;
  else { yesRadio.checked = false; noRadio.checked = false; }

  // 金币显示
  const skillCoin = d.sleepSkillCoin || 0;
  const totalCoin = (d.sleepCoin || 0) + skillCoin;
  const coinText = d.sleepCoin !== null
    ? `获得金币: ${totalCoin >= 0 ? '+' : ''}${fmtCoin(totalCoin)}`
    : '';
  $('sleepCoinDisplay').textContent = coinText;
}

      }

    case '时-光-倒-流': {

        return `<tr class="skill-extra-row"><td colspan="5" style="color:var(--blue);">今日可重骰一次身份</td></tr>`;
      } else if (result === 'hard' || result === 'extreme') {

    case '握烬成光': {
      // 此技能判定为"成功"时（大成功/普通/困难/极难都视为成功）

  const d = getDayData(currentDate);
  d.sleepSuccess = yesRadio.checked ? 'yes' : 'no';
  recalcSleepCoin();
  saveStore();
  renderStatsBar();
  renderSleepRune();
  renderIdentityReview('sleep');
}

function recalcSleepCoin() {
  const d = getDayData(currentDate);
  if (d.sleepSuccess === null) {
    d.sleepCoin = null;
    d.sleepSkillCoin = 0;
    return;
  }
  d.sleepCoin = d.sleepSuccess === 'yes' ? 1 : -1;
  // 不眠者身份(10)：当日沉眠符咒金币特殊计算 —— 成功仍+1，失败也不扣(0)。
  // 仅影响当日沉眠符咒金币，与睡眠积分无关，也不影响次日。
  if (Number(d.sleepIdentity) === 10 && d.sleepSuccess === 'no') {
    d.sleepCoin = 0;
  }

  // 计算技能金币
  let skillCoin = 0;
  const extras = d.sleepSkillExtras || {};

  // 芭丝特的祝福
  const catSkill = d.sleepSkills ? d.sleepSkills['芭丝特的祝福'] : undefined;
  if (catSkill !== undefined && catSkill !== null && catSkill !== '') {
    const j = judgeSkill(catSkill, 65);
    if (j.result === 'crit') {
      skillCoin += 1;
    } else if (j.result === 'normal') {
      const d3 = Number(extras['芭丝特的祝福_d3']) || 0;
      skillCoin += d3 * 0.1;
    } else if (j.result === 'hard') {
      const d3 = Number(extras['芭丝特的祝福_d3']) || 0;
      skillCoin += d3 * 0.2;
    } else if (j.result === 'extreme') {
      const d3 = Number(extras['芭丝特的祝福_d3']) || 0;
      skillCoin += d3 * 0.3;
    } else if (j.result === 'fumble') {
      skillCoin -= 0.5;
    }
  }

  // 握烬成光：仅当身份执行失败时，发动此技能可抵消-1分并追溯0.2分（净+0.2，存储为+1.2）
  const wjjcgSkill = d.sleepSkills ? d.sleepSkills['握烬成光'] : undefined;
  if (d.sleepSuccess === 'no' && wjjcgSkill !== undefined && wjjcgSkill !== null && wjjcgSkill !== '') {
    const j = judgeSkill(wjjcgSkill, 40);
    if (j.result === 'crit' || j.result === 'extreme' || j.result === 'hard' || j.result === 'normal') {
      if (extras['握烬成光_achieved'] === true) {
        skillCoin += 1.2;
      }
    }
  }

  d.sleepSkillCoin = skillCoin;
}

function onSleepSkillExtraChange(skillName, fieldName, value) {
  const d = getDayData(currentDate);
  if (!d.sleepSkillExtras) d.sleepSkillExtras = {};
  if (fieldName === 'achieved') {
    d.sleepSkillExtras[`${skillName}_achieved`] = value;
  } else {
    d.sleepSkillExtras[`${skillName}_${fieldName}`] = value === '' ? undefined : value;
  }
  recalcSleepCoin();
  saveStore();
  renderSleepRune();
  renderStatsBar();
}

// ===== 1.2 琐事固定术渲染 =====
function renderChores() {
  const d = getDayData(currentDate);
  const todayDow = getDayOfWeek(parseDate(currentDate));
  let html = '';

  // 获取本周一
  const monday = parseDate(getMonday(parseDate(currentDate)));
  // 上周五
  const lastFriday = new Date(monday);
  lastFriday.setDate(lastFriday.getDate() - 3);

  for (let dow = 1; dow <= 7; dow++) {
    const dayDate = new Date(monday);
    dayDate.setDate(dayDate.getDate() + dow - 1);
    const dayStr = fmtDate(dayDate);
    const dayData = getDayData(dayStr);
    const chores = CHORE_DEFS[dow % 7] || [];

    if (dow === 4) {
      // 周四: 无打卡项，自动完成逻辑（仅界面显示变化，规则不变）
      const thuComplete = checkThursdayAuto(currentDate);
      const doneIcon = thuComplete ? '<span class="day-done-icon">✅</span>' : '';
      const tagCls = 'chore-tag thu-tag' + (thuComplete ? ' selected' : '');
      const tagText = thuComplete ? '已完成本轮循环' : '未完成本轮循环';
      html += `<div class="chore-row thu-row" style="align-items:center;">
        ${doneIcon}<span class="day-label">周四</span>
        <span class="${tagCls}" style="cursor:default;text-align:center;line-height:1.5;">${tagText}</span>
      </div>`;
      // 更新数据（与原逻辑一致：仅满足条件时标记并计金币）
      if (thuComplete) {
        if (!dayData.chores) dayData.chores = {};
        dayData.chores._thuAuto = true;
        updateChoreCoin(dayStr);
      }
      continue;
    }

    if (!dayData.chores) dayData.chores = {};

    let allDone = chores.length > 0;
    chores.forEach(ch => {
      const selected = dayData.chores[ch] === true;
      if (!selected) allDone = false;
    });

    const doneIcon = allDone ? '<span class="day-done-icon">✅</span>' : '';
    let rowHtml = `<div class="chore-row">${doneIcon}<span class="day-label">${getDayLabel(dayDate)}</span>`;

    if (allDone && chores.length > 0) {
      dayData.choreCoin = 1;
    } else {
      dayData.choreCoin = chores.length > 0 ? 0 : null;
    }

    chores.forEach(ch => {
      const selected = dayData.chores[ch] === true;
      rowHtml += `<span class="chore-tag${selected ? ' selected' : ''}" onclick="toggleChore('${dayStr}', '${ch}')">${ch}</span>`;
    });

    rowHtml += `</div>`;
    html += rowHtml;
  }

  $('choresContainer').innerHTML = html;
  saveStore();

  const coinVal = d.choreCoin;
  $('choreCoinDisplay').textContent = coinVal !== null && coinVal !== undefined ? `获得金币: ${coinVal >= 0 ? '+' : ''}${coinVal}` : '';
}

function checkThursdayAuto(dateStr) {
  const monday = parseDate(getMonday(parseDate(dateStr)));
  // 上周五
  const lastFriday = new Date(monday);
  lastFriday.setDate(lastFriday.getDate() - 3);
  // 本周三
  const thisWed = new Date(monday);
  thisWed.setDate(thisWed.getDate() + 2);

  const current = new Date(lastFriday);
  while (current <= thisWed) {
    const dayStr = fmtDate(current);
    const dayData = getDayData(dayStr);
    const dow = current.getDay();
    const chores = CHORE_DEFS[dow] || [];

    if (dow === 4) {
      // 如果是周四，递归检查
      if (!checkThursdayAuto(dayStr)) return false;
    } else if (chores.length > 0) {
      if (!dayData.chores) return false;
      const allDone = chores.every(ch => dayData.chores[ch] === true);
      if (!allDone) return false;
    }

    current.setDate(current.getDate() + 1);
  }
  return true;
}

function toggleChore(dateStr, choreName) {
  const d = getDayData(dateStr);
  if (!d.chores) d.chores = {};
  d.chores[choreName] = !d.chores[choreName];
  updateChoreCoin(dateStr);
  saveStore();
  renderChores();
  renderStatsBar();
}

function updateChoreCoin(dateStr) {
  const d = getDayData(dateStr);
  const dow = getDayOfWeek(parseDate(dateStr));
  if (dow === 4) {
    // 周四由 checkThursdayAuto 处理
    const complete = checkThursdayAuto(dateStr);
    d.choreCoin = complete ? 1 : 0;
    return;
  }
  const chores = CHORE_DEFS[dow] || [];
  if (chores.length === 0) { d.choreCoin = null; return; }
  if (!d.chores) d.chores = {};
  const allDone = chores.every(ch => d.chores[ch] === true);
  d.choreCoin = allDone ? 1 : 0;
}
